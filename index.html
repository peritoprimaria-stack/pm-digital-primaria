<style>
/* ── RESET & BASE ─────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#B71C1C;
  --primary-dark:#7F0000;
  --primary-light:#EF9A9A;
  --accent:#C62828;
  --bg:#FFF5F5;
  --surface:#FFFFFF;
  --text:#212121;
  --text-light:#757575;
  --border:#E0E0E0;
  --success:#2E7D32;
  --warning:#F57F17;
  --danger:#C62828;
  --radius:8px;
  --shadow:0 2px 8px rgba(0,0,0,.12);
  --sidebar:240px;
}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--primary);text-decoration:none}

/* ── LOADING ──────────────────────────────────────────── */
#loading{position:fixed;inset:0;background:var(--primary);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:#fff}
#loading .spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-size:16px;opacity:.85}

/* ── LOGIN ────────────────────────────────────────────── */
#loginScreen{display:none;min-height:100vh;background:linear-gradient(135deg,var(--primary-dark),var(--primary));align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.2);text-align:center}
.login-card .escudo{width:80px;height:80px;object-fit:contain;margin-bottom:16px;border-radius:50%;background:#f5f5f5;padding:8px}
.login-card h1{font-size:22px;color:var(--primary);margin-bottom:4px}
.login-card h2{font-size:14px;color:var(--text-light);font-weight:400;margin-bottom:28px}
.login-card .school-name{font-size:13px;color:var(--text-light);margin-bottom:24px;padding:8px;background:#f5f8ff;border-radius:6px}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border:2px solid var(--border);border-radius:8px;background:#fff;font-size:15px;font-weight:500;color:var(--text);transition:.2s}
.btn-google:hover{background:#f5f8ff;border-color:var(--primary)}
.btn-google img{width:22px}
.login-error{color:var(--danger);font-size:13px;margin-top:12px;display:none}

/* ── APP LAYOUT ───────────────────────────────────────── */
#app{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}

/* ── SIDEBAR ──────────────────────────────────────────── */
.sidebar{width:var(--sidebar);background:#7F0000;color:#fff;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:.3s}
.sidebar-header{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-header .escudo-small{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);padding:4px;object-fit:contain;margin-bottom:8px}
.sidebar-header .school{font-size:13px;font-weight:600;line-height:1.3}
.sidebar-header .user-info{font-size:11px;opacity:.7;margin-top:4px}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-section{padding:6px 16px;font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.5;margin-top:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13px;cursor:pointer;transition:.15s;border-left:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.08)}
.nav-item.active{background:rgba(255,255,255,.15);border-left-color:var(--primary-light)}
.nav-item .icon{font-size:18px;width:22px;text-align:center}
.nav-item .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;padding:2px 6px;border-radius:10px}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1)}
.btn-logout{width:100%;padding:8px;background:rgba(255,255,255,.1);border:none;color:#fff;border-radius:6px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-logout:hover{background:rgba(255,255,255,.2)}

/* ── MAIN CONTENT ─────────────────────────────────────── */
.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.08);position:sticky;top:0;z-index:50}
.topbar h2{font-size:18px;font-weight:600;color:#B71C1C}
.topbar .topbar-right{display:flex;align-items:center;gap:12px}
.topbar .ciclo-badge{background:#B71C1C;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
.page-content{padding:24px;flex:1}

/* ── CARDS ────────────────────────────────────────────── */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
.card-title{font-size:16px;font-weight:600;color:#B71C1C;margin-bottom:16px;display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:2px solid #FFCDD2}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:20px}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:center;border-top:3px solid var(--primary);transition:.2s}.stat-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(183,28,28,.15)}
.stat-card .stat-num{font-size:32px;font-weight:700;color:var(--primary)}
.stat-card .stat-label{font-size:12px;color:var(--text-light);margin-top:4px}
.stat-card.warning{border-top-color:var(--warning)}
.stat-card.warning .stat-num{color:var(--warning)}
.stat-card.danger{border-top-color:var(--danger)}
.stat-card.danger .stat-num{color:var(--danger)}

/* ── BOTONES ──────────────────────────────────────────── */
.btn{padding:8px 16px;border-radius:6px;border:none;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#7F0000}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#1B5E20}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#B71C1C}
.btn-outline{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn-outline:hover{background:#f5f8ff}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-lg{padding:12px 24px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── FORMULARIOS ──────────────────────────────────────── */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text-light);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.form-control{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;transition:.15s}
.form-control:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,101,192,.1)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ── TABLA ────────────────────────────────────────────── */
.table-container{overflow-x:auto}
table.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{background:var(--primary);color:#fff;padding:10px 12px;text-align:left;font-weight:600;font-size:12px;white-space:nowrap}
.data-table td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table tr:hover td{background:#f5f8ff}
.data-table tr:last-child td{border-bottom:none}

/* ── BADGES ───────────────────────────────────────────── */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-S,.badge-10,.badge-9,.badge-8,.badge-7{background:#E3F2FD;color:#1565C0}
.badge-MB{background:#E8F5E9;color:#2E7D32}
.badge-B{background:#E3F2FD;color:#1565C0}
.badge-R,.badge-6,.badge-5,.badge-4{background:#FFEBEE;color:#C62828}
.badge-D{background:#FFEBEE;color:#C62828}
.badge-P{background:#E8F5E9;color:#2E7D32}
.badge-A{background:#FFEBEE;color:#C62828}
.badge-T{background:#FFF8E1;color:#F57F17}
.badge-RA{background:#FFF3E0;color:#E65100}

/* ── ASISTENCIA ───────────────────────────────────────── */
.asist-grid{display:grid;gap:8px}
.asist-row{display:grid;grid-template-columns:200px 1fr auto;align-items:center;gap:12px;padding:8px 12px;background:#f9f9f9;border-radius:6px;border:1px solid var(--border)}
.asist-nombre{font-size:13px;font-weight:500}
.asist-btns{display:flex;gap:6px}
.asist-btn{padding:5px 10px;border-radius:4px;border:2px solid transparent;font-size:12px;font-weight:700;background:#fff}
.asist-btn.P{border-color:var(--success);color:var(--success)}
.asist-btn.P.active{background:var(--success);color:#fff}
.asist-btn.A{border-color:var(--danger);color:var(--danger)}
.asist-btn.A.active{background:var(--danger);color:#fff}
.asist-btn.T{border-color:var(--warning);color:var(--warning)}
.asist-btn.T.active{background:var(--warning);color:#fff}
.asist-btn.RA{border-color:#E65100;color:#E65100}
.asist-btn.RA.active{background:#E65100;color:#fff}
.asist-obs{width:100%;padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px}

/* ── CALIFICACIONES ───────────────────────────────────── */
.calif-table th,.calif-table td{padding:8px 6px;text-align:center;border:1px solid var(--border)}
.calif-table th:first-child,.calif-table td:first-child{text-align:left;padding-left:12px}
.calif-table thead tr:first-child th{background:var(--primary)}
.calif-input{width:60px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;text-align:center;font-size:13px;font-weight:600}
.calif-input:focus{outline:none;border-color:var(--primary)}

/* ── MODAL ────────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:16px;font-weight:600;color:var(--primary)}
.modal-close{background:none;border:none;font-size:20px;color:var(--text-light);cursor:pointer}
.modal-body{padding:20px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* ── ALERTAS ──────────────────────────────────────────── */
.alert{padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.alert-info{background:#E3F2FD;color:#1565C0;border-left:4px solid var(--primary)}
.alert-success{background:#E8F5E9;color:#2E7D32;border-left:4px solid var(--success)}
.alert-warning{background:#FFF8E1;color:#F57F17;border-left:4px solid var(--warning)}
.alert-danger{background:#FFEBEE;color:#C62828;border-left:4px solid var(--danger)}

/* ── TOAST ────────────────────────────────────────────── */
#toast{position:fixed;bottom:24px;right:24px;background:#323232;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;z-index:9999;display:none;align-items:center;gap:8px;box-shadow:var(--shadow);max-width:360px}
#toast.show{display:flex;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── FILTROS ──────────────────────────────────────────── */
.filtros{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filtros select{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff}

/* ── PROGRESS BAR ─────────────────────────────────────── */
.progress{height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;width:100px}
.progress-bar{height:100%;border-radius:4px;transition:.3s}
.progress-bar.ok{background:var(--success)}
.progress-bar.risk{background:var(--danger)}

/* ── LEGAJO ───────────────────────────────────────────── */
.legajo-card{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;cursor:pointer;transition:.15s}
.legajo-card:hover{border-color:var(--primary);background:#f5f8ff}
.legajo-card .legajo-header{display:flex;justify-content:space-between;align-items:flex-start}
.legajo-card .legajo-nombre{font-weight:600;font-size:14px}
.legajo-card .legajo-meta{font-size:12px;color:var(--text-light);margin-top:4px}
.estado-badge{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:600}
.estado-Activo{background:#E8F5E9;color:#2E7D32}
.estado-Cerrado{background:#ECEFF1;color:#546E7A}

/* ── MENSAJES ─────────────────────────────────────────── */
.msg-item{padding:12px;border-bottom:1px solid var(--border);cursor:pointer;transition:.15s}
.msg-item:hover{background:#f5f8ff}
.msg-item.unread{border-left:3px solid var(--primary);background:#f5f8ff}
.msg-item .msg-asunto{font-weight:600;font-size:13px}
.msg-item .msg-meta{font-size:11px;color:var(--text-light);margin-top:3px}

/* ── RESPONSIVE ───────────────────────────────────────── */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .topbar{padding:0 12px}
  .page-content{padding:12px}
  .form-grid,.form-grid-3{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
  .asist-row{grid-template-columns:1fr;gap:6px}
}
.hamburger{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--primary)}
@media(max-width:768px){.hamburger{display:block}}
</style>
</head>

firebase.initializeApp(FIREBASE_CONFIG);

firebase.auth().onAuthStateChanged(function(user) {
  if (user) {
    verificarUsuarioBackend(user.email);
  } else {
    mostrarLogin();
  }
});

function verificarUsuarioBackend(email) {
  mostrarLoading(true);
  callBackend("verificarUsuario", {email: email}, function(res) {
    if (res.ok) {
      APP.usuario = res.data;
      cargarConfig(function() {
        mostrarApp();
      });
    } else {
      firebase.auth().signOut();
      mostrarLogin();
      mostrarError("Tu cuenta no tiene acceso al sistema. Contactá al director.");
    }
  });
}

function cargarConfig(cb) {
  callBackend("getConfig", {}, function(res) {
    if (res.ok) {
      APP.config = res.data;
      APP.cicloLectivo = res.data.CICLO_LECTIVO || "2025";
      // Recuperar firma y datos del directivo guardados localmente
      inicializarFirmaGuardada();
      // Si el backend tiene el nombre/cargo, usarlo como fallback
      if (!APP.directivoNombre && res.data.DIRECTIVO_NOMBRE) APP.directivoNombre = res.data.DIRECTIVO_NOMBRE;
      if (!APP.directivoCargo  && res.data.DIRECTIVO_CARGO)  APP.directivoCargo  = res.data.DIRECTIVO_CARGO;
    }
    if (cb) cb();
  });
}

function loginGoogle() {
  var provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider).catch(function(err) {
    document.getElementById("loginError").style.display = "block";
    document.getElementById("loginError").textContent = "Error al ingresar: " + err.message;
  });
}

function logout() {
  firebase.auth().signOut().then(function() {
    APP.usuario = null;
    mostrarLogin();
  });
}

function mostrarLoading(show) {
  document.getElementById("loading").style.display = show ? "flex" : "none";
}

function mostrarLogin() {
  mostrarLoading(false);
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("app").style.display = "none";
}

function mostrarApp() {
  mostrarLoading(false);
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";

  // Config UI
  var escuela = APP.config.NOMBRE_ESCUELA || "PM Digital Primaria";
  document.getElementById("sidebarSchool").textContent = escuela;
  document.getElementById("loginSchoolName").textContent = escuela;
  document.getElementById("cicloBadge").textContent = APP.cicloLectivo;

  var u = APP.usuario;
  document.getElementById("sidebarUser").textContent = u.nombre + " " + u.apellido + " (" + u.rol + ")";
  document.getElementById("topbarUser").textContent = u.nombre + " " + u.apellido;

  // CSS colors
  var c = APP.config.COLOR_PRIMARIO || "#1565C0";
  document.documentElement.style.setProperty("--primary", c);

  construirMenu();
  navegarA("dashboard");
}

    {id:"horarios", icon:"🗓️", label:"Horarios", roles:["director","vicedirector","secretario"]},
    {id:"reportes", icon:"📈", label:"Reportes", roles:["director","vicedirector","secretario"]},
    {id:"ausencias_docentes", icon:"👨‍🏫", label:"Aus. Docentes", roles:["director","vicedirector","secretario"]},
    {id:"reuniones", icon:"🤝", label:"Reuniones de Padres", roles:["director","vicedirector","secretario","maestro"]},
    {section:"EOE", roles:["director","vicedirector","secretario","eoe"]},
    {id:"legajos", icon:"📂", label:"Legajos EOE", roles:["director","vicedirector","secretario","eoe"]},
    {section:"Comunicación", roles:["director","vicedirector","secretario","maestro","eoe"]},

    {section:"Administración", roles:["director","vicedirector","secretario"]},
    {id:"usuarios", icon:"👥", label:"Usuarios", roles:["director","vicedirector","secretario"]},
    {id:"configuracion", icon:"⚙️", label:"Configuración", roles:["director"]},
  ];

  items.forEach(function(item) {
    if (!item.roles.includes(rol)) return;
    if (item.section) {
      var el = document.createElement("div");
      el.className = "nav-section";
      el.textContent = item.section;
      nav.appendChild(el);
    } else {
      var el = document.createElement("div");
      el.className = "nav-item";
      el.id = "nav-" + item.id;
      el.innerHTML = '<span class="icon">' + item.icon + '</span>' + item.label;
      el.onclick = function() { navegarA(item.id); };
      nav.appendChild(el);
    }
  });
}

function navegarA(pagina) {
  APP.paginaActual = pagina;
  document.querySelectorAll(".nav-item").forEach(function(el) {
    el.classList.remove("active");
  });
  var navEl = document.getElementById("nav-" + pagina);
  if (navEl) navEl.classList.add("active");

  var titulos = {
    dashboard:"Dashboard", asistencia:"Asistencia", calificaciones:"Calificaciones",
    alumnos:"Alumnos", boletin:"Boletines", horarios:"Horarios", reportes:"Reportes",
    ausencias_docentes:"Ausencias Docentes", reuniones:"Reuniones de Padres",
    legajos:"Legajos EOE", mensajes:"Mensajes", usuarios:"Usuarios", configuracion:"Configuración"
  };
  document.getElementById("pageTitle").textContent = titulos[pagina] || pagina;

  var paginas = {
    dashboard: renderDashboard,
    asistencia: renderAsistencia,
    calificaciones: renderCalificaciones,
    alumnos: renderAlumnos,
    boletin: renderBoletin,
    horarios: renderHorarios,
    reportes: renderReportes,
    ausencias_docentes: renderAusenciasDocentes,
    reuniones: renderReuniones,
    legajos: renderLegajos,
    mensajes: renderMensajes,
    usuarios: renderUsuarios,
    configuracion: renderConfiguracion
  };

  if (paginas[pagina]) paginas[pagina]();
  toggleSidebar(false);
}

function toggleSidebar(force) {
  var s = document.getElementById("sidebar");
  if (force === false) { s.classList.remove("open"); return; }
  s.classList.toggle("open");
}

function getSaludo() {
  var hora = new Date().getHours();
  var saludo = hora >= 6 && hora < 12 ? "Buenos días" : hora >= 12 && hora < 20 ? "Buenas tardes" : "Buenas noches";
  var frasesDia = [
    "Que sea un gran día para toda la comunidad educativa 🌟",
    "Un nuevo día, nuevas oportunidades para enseñar y aprender 📚",
    "Que todo fluya bien hoy en el Colegio Perito Moreno 🏫",
    "Que tengas un día lleno de energía y buenas noticias 💪",
    "Gracias por el trabajo que hacés cada día por los chicos 🙌",
    "Que hoy sea un día tranquilo y productivo ✨",
    "Un abrazo digital para empezar el día con todo 🤗"
  ];
  var frasesNoche = [
    "Trabajando hasta tarde, ¡eso se admira! 🌙",
    "El compromiso no tiene horario. Gracias por todo lo que hacés 💫",
    "Cerrando el día con todo. ¡Merecés un descanso! 🌟",
    "Los mejores docentes siempre tienen algo más para dar. Gracias 🙏",
    "Que esta noche traigas paz después de un día de tanto trabajo ✨",
    "El colegio es lo que es gracias a personas como vos 🏫",
    "Que descanses bien, mañana hay otro gran día por delante 😊"
  ];
  var pool = (hora >= 20 || hora < 6) ? frasesNoche : frasesDia;
  var frase = pool[new Date().getDay() % pool.length];
  var nombre = APP.usuario.nombre || APP.usuario.apellido || "";
  return { saludo: saludo, nombre: nombre, frase: frase };
}

        var __sg=document.getElementById("statsGrid");if(__sg)__sg.innerHTML =
          statCard("🏫", APP.config.NOMBRE_ESCUELA || "Escuela", "Institución", "") +
          statCard("📅", APP.cicloLectivo, "Ciclo Lectivo", "") +
          statCard("👤", APP.usuario.nombre + " " + APP.usuario.apellido, "Director/a", "");
        var __da=document.getElementById("dashAlerts");if(__da)__da.innerHTML =
          '<div class="card"><div class="alert alert-info">📌 Sistema iniciado correctamente. Comenzá cargando alumnos en el módulo <b>Alumnos</b>.</div></div>';
        return;
      }
      var data = res.data || [];
      var totalAlumnos = data.reduce(function(s,d){return s+(d.total_alumnos||0)},0);
      var totalSecciones = data.length;
      var promPct = data.length > 0
        ? Math.round(data.reduce(function(s,d){return s+(d.promedio_asistencia_pct||0)},0)/data.length)
        : 0;
      var __sg=document.getElementById("statsGrid");if(__sg)__sg.innerHTML =
        statCard("👨‍🎓", totalAlumnos || "0", "Alumnos", "") +
        statCard("🏫", totalSecciones || "0", "Secciones activas", "") +
        statCard("📅", APP.cicloLectivo, "Ciclo Lectivo", "") +
        statCard("📊", promPct > 0 ? promPct + "%" : "—", "Asistencia promedio", promPct > 0 && promPct < 75 ? "danger" : "");

      if (data.length === 0) {
        var __da=document.getElementById("dashAlerts");if(__da)__da.innerHTML =
          '<div class="card"><div class="alert alert-info">📌 Sistema listo. Comenzá cargando alumnos en el módulo <b>Alumnos</b>.</div></div>';
        return;
      }

      // ── Mostrar gráficos ──────────────────────────────────────
      var dc = document.getElementById("dashCharts");
      if (dc) dc.style.display = "block";
      setTimeout(function(){ renderDashCharts(data); }, 80);

      // ── Tabla resumen ─────────────────────────────────────────
      var tabla = '<div class="card"><div class="card-title">📋 Resumen por Sección</div><div class="table-container"><table class="data-table"><thead><tr><th>Grado</th><th>Sección</th><th>Alumnos</th><th>Asistencia</th></tr></thead><tbody>';
      data.forEach(function(d) {
        var pct = d.promedio_asistencia_pct || 0;
        var color = pct >= 80 ? "var(--success)" : "var(--danger)";
        tabla += '<tr><td>' + d.grado + '°</td><td>' + d.seccion + '</td><td>' + d.total_alumnos + '</td>'
          + '<td><div style="display:flex;align-items:center;gap:8px">'
          + '<div class="progress"><div class="progress-bar ' + (pct>=80?'ok':'risk') + '" style="width:'+pct+'%"></div></div>'
          + '<span style="color:'+color+';font-weight:600">'+pct+'%</span></div></td></tr>';
      });
      tabla += "</tbody></table></div></div>";
      var __da=document.getElementById("dashAlerts");if(__da)__da.innerHTML = tabla;
    });
  }
}

function statCard(icon, num, label, tipo) {
  return '<div class="stat-card '+(tipo||'')+'"><div style="font-size:28px">'+icon+'</div><div class="stat-num">'+num+'</div><div class="stat-label">'+label+'</div></div>';
}

// ASISTENCIA
// ════════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════════
// ASISTENCIA
// Turno mañana: banda 8:00-8:30 / Turno tarde: 13:00-13:30
// Estados: P=Presente A=Ausente T=Tarde
// Umbral de riesgo: 5 inasistencias por trimestre
// ════════════════════════════════════════════════════════════

var asistenciaActual = [];
var TRIMESTRES = [
  {label:"1° Trimestre", desde:"03-01", hasta:"06-30"},
  {label:"2° Trimestre", desde:"07-01", hasta:"09-30"},
  {label:"3° Trimestre", desde:"10-01", hasta:"12-31"}
];
var UMBRAL_RIESGO = 5;

function getTrimestre(fecha) {
  if (!fecha) return 0;
  var mes = parseInt(fecha.split("-")[1]);
  if (mes <= 6)  return 1;
  if (mes <= 9)  return 2;
  return 3;
}

function renderAsistencia() {
  var pc = document.getElementById("pageContent");
  var hoy = fechaHoy();
  var esAdmin = ["director","vicedirector","secretario"].includes(APP.usuario.rol);
  var gradoU   = APP.usuario.rol === "maestro" ? String(APP.usuario.grado) : "";
  var seccionU = APP.usuario.rol === "maestro" ? APP.usuario.seccion : "";
  var trimActual = getTrimestre(hoy);

  var gradoOpts = [1,2,3,4,5,6].map(function(g){
    return "<option value=\""+g+"\"" + (String(gradoU)===String(g)?" selected":"") + ">"+g+"°</option>";
  }).join("");
  var trimOpts = TRIMESTRES.map(function(t,i){
    return "<option value=\"" + (i+1) + "\"" + (trimActual===(i+1)?" selected":"") + ">" + t.label + "</option>";
  }).join("");

  pc.innerHTML =
    // ── TOMAR ASISTENCIA ──────────────────────────────────────
    "<div class=\"card\">" +
      "<div class=\"card-title\">📋 Tomar Asistencia</div>" +
      "<div class=\"filtros\">" +
        "<input type=\"date\" id=\"asistFecha\" class=\"form-control\" style=\"width:180px\" value=\""+hoy+"\">"+
        (esAdmin
          ? "<select id=\"asistGrado\" class=\"form-control\" style=\"width:100px\"><option value=\"\">Grado</option>"+gradoOpts+"</select>" +
            "<select id=\"asistSeccion\" class=\"form-control\" style=\"width:100px\">" +
              "<option value=\"\">Sección</option><option value=\"A\">A</option><option value=\"B\">B</option>" +
            "</select>"
          : "<input type=\"hidden\" id=\"asistGrado\" value=\""+gradoU+"\"><input type=\"hidden\" id=\"asistSeccion\" value=\""+seccionU+"\">" +
            "<span class=\"badge badge-P\" style=\"font-size:13px\">"+gradoU+"° "+seccionU+"</span>"
        ) +
        "<button class=\"btn btn-primary\" onclick=\"cargarListaAsistencia()\">📋 Cargar lista</button>" +
      "</div>" +
      "<div id=\"asistLista\"></div>" +
      "<div id=\"asistAcciones\" style=\"display:none;margin-top:12px;gap:8px;flex-wrap:wrap\">" +
        "<button class=\"btn btn-success\" onclick=\"guardarAsistencia()\">💾 Guardar asistencia</button>" +
        "<button class=\"btn btn-outline\" onclick=\"marcarTodos('P')\">✅ Todos presentes</button>" +
        "<button class=\"btn btn-outline\" onclick=\"marcarTodos('A')\">❌ Todos ausentes</button>" +
      "</div>" +
    "</div>" +
    // ── RESUMEN POR TRIMESTRE ──────────────────────────────────
    "<div class=\"card\">" +
      "<div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:12px\">" +
        "<div class=\"card-title\" style=\"margin:0\">📊 Resumen de asistencia</div>" +
        "<div style=\"display:flex;gap:8px\">" +
          "<select id=\"resGrado\" class=\"form-control\" style=\"width:100px\"><option value=\"\">Grado</option>"+gradoOpts+"</select>" +
          "<select id=\"resSeccion\" class=\"form-control\" style=\"width:100px\">" +
            "<option value=\"\">Sección</option><option value=\"A\">A</option><option value=\"B\">B</option>" +
          "</select>" +
          "<select id=\"resTrimestre\" class=\"form-control\" style=\"width:160px\">"+trimOpts+"</select>" +
          "<button class=\"btn btn-primary\" onclick=\"cargarResumenAsistencia()\">Ver</button>" +
        "</div>" +
      "</div>" +
      "<div id=\"resumenAsist\"><p style=\"color:var(--text-light);font-size:13px\">Seleccioná grado, sección y trimestre.</p></div>" +
    "</div>";

  if (APP.usuario.rol === "maestro") {
    document.getElementById("resGrado").value   = gradoU;
    document.getElementById("resSeccion").value = seccionU;
    cargarListaAsistencia();
    cargarResumenAsistencia();
  }
}

function cargarListaAsistencia() {
  var fecha   = document.getElementById("asistFecha").value;
  var grado   = document.getElementById("asistGrado").value;
  var seccion = document.getElementById("asistSeccion").value;
  if (!grado || !seccion) { toast("Seleccioná grado y sección"); return; }

  document.getElementById("asistLista").innerHTML = "<p style=\"color:var(--text-light);font-size:13px\">Cargando...</p>";

  callBackend("getAlumnos", {grado: grado, seccion: seccion, ciclo_lectivo: APP.cicloLectivo}, function(resA) {
    if (!resA.ok || resA.data.length === 0) {
      document.getElementById("asistLista").innerHTML = "<div class=\"alert alert-info\">No hay alumnos en este grado/sección.</div>";
      return;
    }
    callBackend("getAsistencia", {fecha: fecha, grado: grado, seccion: seccion}, function(resR) {
      var registros = {};
      if (resR.ok) resR.data.forEach(function(r){ registros[r.id_alumno] = r; });

      asistenciaActual = resA.data.map(function(al) {
        var reg = registros[al.id_alumno];
        return {
          id_alumno:       al.id_alumno,
          apellido_nombre: al.apellido + ", " + al.nombre,
          grado:           grado,
          seccion:         seccion,
          estado:          reg ? reg.estado : "P",
          observacion:     reg ? (reg.observacion||"") : ""
        };
      });
      renderListaAsistencia();
      var acc = document.getElementById("asistAcciones");
      if (acc) acc.style.display = "flex";
    });
  });
}

function renderListaAsistencia() {
  var estadoLabel = {P:"Presente", A:"Ausente", T:"Tarde"};
  var estadoColor = {P:"badge-P", A:"badge-A", T:"badge-T"};
  var html = "<div class=\"asist-grid\">";
  asistenciaActual.forEach(function(al, idx) {
    html += "<div class=\"asist-row\">" +
      "<div class=\"asist-nombre\">"+al.apellido_nombre+"</div>" +
      "<div class=\"asist-btns\">" +
        ["P","A","T"].map(function(e){
          var lbl = {P:"✅ P",A:"❌ A",T:"⏰ T"}[e];
          return "<button class=\"asist-btn "+e+(al.estado===e?" active":"")+"\" onclick=\"setEstado("+idx+",this,'"+e+"')\">"+lbl+"</button>";
        }).join("") +
      "</div>" +
      "<input class=\"asist-obs\" placeholder=\"Observación...\" value=\""+( al.observacion||"").replace(/"/g,"&quot;")+"\" oninput=\"setObs("+idx+",this.value)\">" +
    "</div>";
  });
  html += "</div>";
  document.getElementById("asistLista").innerHTML = html;
}

function setEstado(idx, btn, estado) {
  asistenciaActual[idx].estado = estado;
  var row = btn.closest(".asist-row");
  row.querySelectorAll(".asist-btn").forEach(function(b){ b.classList.remove("active"); });
  btn.classList.add("active");
}
function setObs(idx, val) { asistenciaActual[idx].observacion = val; }
function marcarTodos(estado) {
  asistenciaActual.forEach(function(a){ a.estado = estado; });
  renderListaAsistencia();
}

function guardarAsistencia() {
  if (asistenciaActual.length === 0) { toast("Cargá la lista primero"); return; }
  var fecha   = document.getElementById("asistFecha").value;
  var grado   = document.getElementById("asistGrado").value;
  var seccion = document.getElementById("asistSeccion").value;
  callBackend("guardarAsistencia", {
    fecha: fecha, grado: grado, seccion: seccion,
    trimestre: getTrimestre(fecha),
    ciclo_lectivo: APP.cicloLectivo,
    registros: asistenciaActual
  }, function(res) {
    if (res.ok) {
      toast("✅ Asistencia guardada — " + res.data.registros + " registros");
      cargarResumenAsistencia();
    } else toast("❌ " + res.error);
  });
}

function cargarResumenAsistencia() {
  var grado    = (document.getElementById("resGrado")    || document.getElementById("asistGrado")).value    || APP.usuario.grado;
  var seccion  = (document.getElementById("resSeccion")  || document.getElementById("asistSeccion")).value  || APP.usuario.seccion;
  var trimestre = document.getElementById("resTrimestre") ? document.getElementById("resTrimestre").value : getTrimestre(fechaHoy());
  if (!grado || !seccion) { toast("Seleccioná grado y sección"); return; }

  document.getElementById("resumenAsist").innerHTML = "<p style=\"color:var(--text-light);font-size:13px\">Cargando...</p>";

  callBackend("getResumenAsistencia", {
    grado: String(grado), seccion: seccion,
    trimestre: trimestre, ciclo_lectivo: APP.cicloLectivo
  }, function(res) {
    if (!res.ok || !res.data || res.data.length === 0) {
      document.getElementById("resumenAsist").innerHTML = "<div class=\"alert alert-info\">Sin datos de asistencia para este período.</div>";
      return;
    }

    var trimLabel = TRIMESTRES[(parseInt(trimestre)||1)-1].label;
    var enRiesgo = res.data.filter(function(a){ return a.ausentes >= UMBRAL_RIESGO; });

    var html = "";

    // Alerta si hay alumnos en riesgo
    if (enRiesgo.length > 0) {
      html += "<div class=\"alert alert-warning\" style=\"margin-bottom:12px\">" +
        "<strong>⚠️ "+enRiesgo.length+" alumno/s con "+UMBRAL_RIESGO+"+ inasistencias en el "+trimLabel+":</strong> " +
        enRiesgo.map(function(a){ return "<strong>"+a.apellido_nombre+"</strong> ("+a.ausentes+" aus.)"; }).join(", ") +
      "</div>";
    }

    html += "<p style=\"font-size:12px;color:var(--text-light);margin-bottom:8px\"><strong>"+trimLabel+"</strong> — "+grado+"°"+seccion+"</p>";
    html += "<div class=\"table-container\"><table class=\"data-table\">" +
      "<thead><tr>" +
        "<th>Alumno/a</th>" +
        "<th style=\"text-align:center\">Presentes</th>" +
        "<th style=\"text-align:center;color:var(--danger)\">Ausentes</th>" +
        "<th style=\"text-align:center;color:var(--warning)\">Tardes</th>" +
        "<th style=\"text-align:center\">% Asistencia</th>" +
        "<th>Estado</th>" +
      "</tr></thead><tbody>";

    res.data.forEach(function(a) {
      var riesgo = a.ausentes >= UMBRAL_RIESGO;
      var pct    = a.porcentaje || 0;
      var color  = riesgo ? "var(--danger)" : pct >= 85 ? "var(--success)" : "var(--warning)";
      html += "<tr style=\"" + (riesgo ? "background:rgba(220,53,69,.04)" : "") + "\">" +
        "<td><strong>"+a.apellido_nombre+"</strong></td>" +
        "<td style=\"text-align:center\">"+a.presentes+"</td>" +
        "<td style=\"text-align:center;font-weight:600;color:var(--danger)\">"+a.ausentes+"</td>" +
        "<td style=\"text-align:center;color:var(--warning)\">"+a.tardes+"</td>" +
        "<td>" +
          "<div style=\"display:flex;align-items:center;gap:6px\">" +
            "<div class=\"progress\" style=\"flex:1\"><div class=\"progress-bar " + (riesgo?"risk":"ok") + "\" style=\"width:"+pct+"%\"></div></div>" +
            "<span style=\"color:"+color+";font-weight:600;min-width:36px\">"+pct+"%</span>" +
          "</div>" +
        "</td>" +
        "<td>"+(riesgo
          ? "<span class=\"badge badge-A\">⚠ Intensificación</span>"
          : pct >= 85
            ? "<span class=\"badge badge-P\">✓ Regular</span>"
            : "<span class=\"badge\" style=\"background:#fff3cd;color:#856404\">Seguimiento</span>"
        )+"</td>" +
      "</tr>";
    });

    html += "</tbody></table></div>";
    document.getElementById("resumenAsist").innerHTML = html;
  });
}

function renderCalificaciones() {
  var pc = document.getElementById("pageContent");
  var esAdmin = ["director","vicedirector","secretario"].includes(APP.usuario.rol);
  var grado = APP.usuario.rol === "maestro" ? String(APP.usuario.grado) : "1";
  var seccion = APP.usuario.rol === "maestro" ? APP.usuario.seccion : "A";

  pc.innerHTML = `
  <div class="card">
    <div class="card-title">📝 Carga de Calificaciones</div>
    <div class="filtros">
      ${esAdmin ? `
      <select id="califGrado" class="form-control" style="width:100px" onchange="cargarCalificaciones()">
        ${[1,2,3,4,5,6].map(g=>'<option value="'+g+'"'+(g==1?' selected':'')+'>'+g+'°</option>').join('')}
      </select>
      <select id="califSeccion" class="form-control" style="width:100px" onchange="cargarCalificaciones()">
        <option value="A">A</option><option value="B">B</option>
      </select>` : `
      <input type="hidden" id="califGrado" value="${grado}">
      <input type="hidden" id="califSeccion" value="${seccion}">
      <span class="badge badge-P" style="font-size:13px">${grado}° ${seccion}</span>`}
      <select id="califPeriodo" class="form-control" style="width:160px" onchange="cargarCalificaciones()">
        <option value="informe_1">1° Informe</option>
        <option value="informe_2">2° Informe</option>
        <option value="informe_3">3° Informe</option>
        <option value="periodo_extendido">Per. Extendido</option>
        <option value="informe_final">Informe Final</option>
      </select>
    </div>
    <div id="califTabla">
      <p style="color:var(--text-light);font-size:13px;padding:12px">Seleccioná grado y período para cargar.</p>
    </div>
    <div id="califAcciones" style="margin-top:12px;display:none">
      <button class="btn btn-success btn-lg" onclick="guardarCalificacionesBloque()">💾 Guardar todo</button>
      <span id="califStatus" style="margin-left:12px;font-size:13px;color:var(--text-light)"></span>
    </div>
  </div>`;

  cargarCalificaciones();

var califData = {};
var califAlumnos = [];

function cargarCalificaciones() {
  var grado   = document.getElementById("califGrado").value;
  var seccion = document.getElementById("califSeccion").value;
  var periodo = document.getElementById("califPeriodo").value;
  if (!grado || !seccion) return;

  var esPrimerCiclo = parseInt(grado) <= 3;
  var areas = esPrimerCiclo
    ? ["PRACTICAS_LENGUAJE","MATEMATICA","CIENCIAS_SOCIALES","CIENCIAS_NATURALES","ED_ARTISTICA","ED_FISICA"]
    : ["PRACTICAS_LENGUAJE","MATEMATICA","CIENCIAS_SOCIALES","CIENCIAS_NATURALES","ED_ARTISTICA","ED_FISICA","INGLES"];
  var escala = esPrimerCiclo ? ["D","R","B","MB","S"] : ["4","5","6","7","8","9","10"];
  var nombres = {
    PRACTICAS_LENGUAJE:"Prácticas del Lenguaje",MATEMATICA:"Matemática",
    CIENCIAS_SOCIALES:"Ciencias Sociales",CIENCIAS_NATURALES:"Ciencias Naturales",
    ED_ARTISTICA:"Educación Artística",ED_FISICA:"Educación Física",INGLES:"Inglés"
  };

  document.getElementById("califTabla").innerHTML = '<p style="color:var(--text-light);font-size:13px;padding:12px">Cargando...</p>';

  callBackend("getAlumnos", {grado: grado, seccion: seccion}, function(resAl) {
    if (!resAl.ok || resAl.data.length === 0) {
      document.getElementById("califTabla").innerHTML = '<div class="alert alert-info">No hay alumnos para este grado/sección.</div>';
      return;
    }
    califAlumnos = resAl.data;

    callBackend("getCalificaciones", {grado: grado, seccion: seccion, ciclo_lectivo: APP.cicloLectivo}, function(resC) {
      califData = {};
      if (resC.ok) {
        resC.data.forEach(function(c) {
          if (!califData[c.id_alumno]) califData[c.id_alumno] = {};
          califData[c.id_alumno][c.area] = c;
        });
      }

      var escalaOpts = escala.map(function(e){ return '<option value="'+e+'">'+e+'</option>'; }).join("");
      var aprobados = esPrimerCiclo ? ["B","MB","S"] : ["7","8","9","10"];

      var html = '<div class="table-container"><table class="data-table calif-table"><thead>'
        +'<tr><th rowspan="2" style="min-width:160px">Alumno/a</th>'
        + areas.map(function(a){ return '<th>'+nombres[a]+'</th>'; }).join("") +'</tr>'
        +'</thead><tbody>';

      califAlumnos.forEach(function(al) {
        html += '<tr><td style="font-weight:500">' + al.apellido + ', ' + al.nombre + '</td>';
        areas.forEach(function(area) {
          var val = (califData[al.id_alumno] && califData[al.id_alumno][area])
            ? (califData[al.id_alumno][area][periodo] || "") : "";
          var color = val ? (aprobados.includes(val) ? "#2E7D32" : "#C62828") : "#333";
          html += '<td><select class="calif-input" style="color:'+color+';border-color:'+color
            +'" data-id="'+al.id_alumno+'" data-area="'+area+'" data-apellido="'+al.apellido+' '+al.nombre
            +'" data-grado="'+grado+'" data-seccion="'+seccion
            +'" onchange="onCalifChange(this,\''+(!esPrimerCiclo).toString()+'\')">'
            +'<option value="">—</option>' + escalaOpts
            +'</select></td>';
        });
        html += '</tr>';
      });

      html += '</tbody></table></div>';
      html += '<div style="margin-top:8px;font-size:12px;color:var(--text-light)">';
      html += esPrimerCiclo
        ? '📌 Escala 1° Ciclo: <b>S</b>=Sobresaliente · <b>MB</b>=Muy Bueno · <b>B</b>=Bueno ✅ · <b>R</b>=Regular ❌ · <b>D</b>=Desaprobado ❌'
        : '📌 Escala 2° Ciclo: <b>7-10</b>=Aprobado ✅ · <b>4-6</b>=Desaprobado ❌';
      html += '</div>';

      document.getElementById("califTabla").innerHTML = html;
      document.getElementById("califAcciones").style.display = "block";

      // Setear valores actuales en los selects
      califAlumnos.forEach(function(al) {
        areas.forEach(function(area) {
          var val = (califData[al.id_alumno] && califData[al.id_alumno][area])
            ? (califData[al.id_alumno][area][periodo] || "") : "";
          var sel = document.querySelector('select[data-id="'+al.id_alumno+'"][data-area="'+area+'"]');
          if (sel && val) sel.value = val;
        });
      });
    });
  });
}

function onCalifChange(sel, esNumerico) {
  var val = sel.value;
  var aprobados = esNumerico === "true" ? ["7","8","9","10"] : ["B","MB","S"];
  var color = val ? (aprobados.includes(val) ? "#2E7D32" : "#C62828") : "#333";
  sel.style.color = color;
  sel.style.borderColor = val ? color : "#ccc";
}

function guardarCalificacionesBloque() {
  var periodo = document.getElementById("califPeriodo").value;
  var grado   = document.getElementById("califGrado").value;
  var seccion = document.getElementById("califSeccion").value;
  var sels = document.querySelectorAll(".calif-input");
  var califs = [];
  sels.forEach(function(sel) {
    if (!sel.value) return;
    var obj = {
      id_alumno: sel.dataset.id,
      apellido_nombre: sel.dataset.apellido,
      grado: grado,
      seccion: seccion,
      area: sel.dataset.area,
      ciclo_lectivo: APP.cicloLectivo
    };
    obj[periodo] = sel.value;
    califs.push(obj);
  });
  if (califs.length === 0) { toast("No hay calificaciones para guardar"); return; }
  document.getElementById("califStatus").textContent = "Guardando...";
  callBackend("guardarCalificacionesBloque", {calificaciones: califs}, function(res) {
    if (res.ok) {
      toast("✅ " + res.data.guardadas + " calificaciones guardadas");
      document.getElementById("califStatus").textContent = "✅ Guardado";
    } else {
      toast("❌ Error: " + res.error);
    }
  });
}

// DASHBOARD CHARTS
// ════════════════════════════════════════════════════════════
function renderDashCharts(data) {
  // ── Colores ──────────────────────────────────────────────
  var colorOk   = "#2E7D32";
  var colorRisk = "#C62828";
  var colorBar  = "#B71C1C";
  var colorLine = "#1565C0";
  var colorGrid = "#e0e0e0";

  // ── Helper: dibujar barra ────────────────────────────────
  function drawBar(ctx, x, y, w, h, color, radius) {
    radius = Math.min(radius||4, h);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + w - radius, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  // ── GRÁFICO 1: Barras — asistencia por sección ──────────
  var cb = document.getElementById("chartBarras");
  if (cb) {
    var ctx1 = cb.getContext("2d");
    var W = cb.offsetWidth || 400; cb.width = W; cb.height = 200;
    var pad = {top:20, right:20, bottom:40, left:40};
    var cw = W - pad.left - pad.right;
    var ch = 200 - pad.top - pad.bottom;
    var n = data.length;
    var barW = Math.min(36, (cw / n) - 8);

    // Grilla
    ctx1.strokeStyle = colorGrid; ctx1.lineWidth = 1;
    [0,25,50,75,100].forEach(function(v) {
      var y = pad.top + ch - (v/100)*ch;
      ctx1.beginPath(); ctx1.moveTo(pad.left, y); ctx1.lineTo(pad.left+cw, y); ctx1.stroke();
      ctx1.fillStyle="#999"; ctx1.font="10px Arial"; ctx1.textAlign="right";
      ctx1.fillText(v+"%", pad.left-4, y+3);
    });

    // Barras
    data.forEach(function(d, i) {
      var pct = d.promedio_asistencia_pct || 0;
      var x = pad.left + (i / n) * cw + (cw/n - barW)/2;
      var bh = (pct/100) * ch;
      var by = pad.top + ch - bh;
      var col = pct >= 80 ? colorOk : colorRisk;
      drawBar(ctx1, x, by, barW, bh, col, 4);
      // Etiqueta %
      ctx1.fillStyle = col; ctx1.font = "bold 10px Arial"; ctx1.textAlign = "center";
      ctx1.fillText(pct+"%", x + barW/2, by - 4);
      // Etiqueta grado
      ctx1.fillStyle = "#555"; ctx1.font = "10px Arial";
      ctx1.fillText(d.grado+"°"+d.seccion, x + barW/2, pad.top+ch+14);
    });

    // Línea de referencia 80%
    var refY = pad.top + ch - (0.80 * ch);
    ctx1.setLineDash([4,3]); ctx1.strokeStyle="#F57F17"; ctx1.lineWidth=1.5;
    ctx1.beginPath(); ctx1.moveTo(pad.left, refY); ctx1.lineTo(pad.left+cw, refY); ctx1.stroke();
    ctx1.setLineDash([]);
    ctx1.fillStyle="#F57F17"; ctx1.font="9px Arial"; ctx1.textAlign="left";
    ctx1.fillText("mín. 80%", pad.left+4, refY-3);
  }

  // ── GRÁFICO 2: Líneas — tendencia por trimestre ──────────
  var cl = document.getElementById("chartLineas");
  if (cl) {
    var ctx2 = cl.getContext("2d");
    var W2 = cl.offsetWidth || 400; cl.width = W2; cl.height = 200;
    var pad2 = {top:20, right:20, bottom:40, left:40};
    var cw2 = W2 - pad2.left - pad2.right;
    var ch2 = 200 - pad2.top - pad2.bottom;

    // Simulamos tendencia promedio por trimestre usando los datos disponibles
    // Si hay datos reales de estadísticas con histórico se usarían, por ahora usamos la data actual como ref
    var promActual = data.length > 0
      ? Math.round(data.reduce(function(s,d){ return s+(d.promedio_asistencia_pct||0); },0) / data.length)
      : 0;

    // Construir puntos: estimamos T1=promedio+5, T2=promedio, T3=promedio-3 (a reemplazar con datos reales)
    var labels = ["1° Trim.", "2° Trim.", "3° Trim."];
    var puntos = [
      Math.min(100, promActual + 5),
      promActual,
      Math.max(0, promActual - 3)
    ];

    // Si el backend devuelve histórico real, usarlo
    if (data[0] && data[0].t1_pct !== undefined) {
      puntos = [
        Math.round(data.reduce(function(s,d){ return s+(d.t1_pct||0); },0)/data.length),
        Math.round(data.reduce(function(s,d){ return s+(d.t2_pct||0); },0)/data.length),
        Math.round(data.reduce(function(s,d){ return s+(d.t3_pct||0); },0)/data.length)
      ];
    }

    // Grilla
    ctx2.strokeStyle = colorGrid; ctx2.lineWidth = 1;
    [0,25,50,75,100].forEach(function(v) {
      var y = pad2.top + ch2 - (v/100)*ch2;
      ctx2.beginPath(); ctx2.moveTo(pad2.left, y); ctx2.lineTo(pad2.left+cw2, y); ctx2.stroke();
      ctx2.fillStyle="#999"; ctx2.font="10px Arial"; ctx2.textAlign="right";
      ctx2.fillText(v+"%", pad2.left-4, y+3);
    });

    // Área bajo la línea
    ctx2.beginPath();
    puntos.forEach(function(p, i) {
      var x = pad2.left + (i / (puntos.length-1)) * cw2;
      var y = pad2.top + ch2 - (p/100)*ch2;
      if (i===0) ctx2.moveTo(x, y); else ctx2.lineTo(x, y);
    });
    ctx2.lineTo(pad2.left + cw2, pad2.top + ch2);
    ctx2.lineTo(pad2.left, pad2.top + ch2);
    ctx2.closePath();
    ctx2.fillStyle = "rgba(21,101,192,.08)";
    ctx2.fill();

    // Línea
    ctx2.beginPath();
    puntos.forEach(function(p, i) {
      var x = pad2.left + (i / (puntos.length-1)) * cw2;
      var y = pad2.top + ch2 - (p/100)*ch2;
      if (i===0) ctx2.moveTo(x, y); else ctx2.lineTo(x, y);
    });
    ctx2.strokeStyle = colorLine; ctx2.lineWidth = 2.5; ctx2.stroke();

    // Puntos y etiquetas
    puntos.forEach(function(p, i) {
      var x = pad2.left + (i / (puntos.length-1)) * cw2;
      var y = pad2.top + ch2 - (p/100)*ch2;
      ctx2.beginPath(); ctx2.arc(x, y, 5, 0, Math.PI*2);
      ctx2.fillStyle = colorLine; ctx2.fill();
      ctx2.fillStyle = colorLine; ctx2.font = "bold 11px Arial"; ctx2.textAlign = "center";
      ctx2.fillText(p+"%", x, y-10);
      ctx2.fillStyle = "#555"; ctx2.font = "10px Arial";
      ctx2.fillText(labels[i], x, pad2.top+ch2+16);
    });

    // Referencia 80%
    var refY2 = pad2.top + ch2 - (0.80 * ch2);
    ctx2.setLineDash([4,3]); ctx2.strokeStyle="#F57F17"; ctx2.lineWidth=1.5;
    ctx2.beginPath(); ctx2.moveTo(pad2.left, refY2); ctx2.lineTo(pad2.left+cw2, refY2); ctx2.stroke();
    ctx2.setLineDash([]);
  }
}

var alumnosLista = [];

function cargarAlumnos() {
  var grado   = document.getElementById("alumGrado").value;
  var seccion = document.getElementById("alumSeccion").value;
  callBackend("getAlumnos", {grado: grado, seccion: seccion}, function(res) {
    if (!res.ok) { document.getElementById("alumnosTabla").innerHTML = "<p>Error</p>"; return; }
    alumnosLista = res.data;
    renderTablaAlumnos(alumnosLista);
  });
}

function filtrarAlumnos() {
  var q = document.getElementById("alumBuscar").value.toLowerCase();
  var filtrados = alumnosLista.filter(function(a) {
    return (a.apellido + " " + a.nombre + " " + a.dni).toLowerCase().includes(q);
  });
  renderTablaAlumnos(filtrados);
}

function renderTablaAlumnos(lista) {
  if (lista.length === 0) {
    document.getElementById("alumnosTabla").innerHTML = '<div class="alert alert-info">No hay alumnos para mostrar.</div>';
    return;
  }
  var html = '<div class="table-container"><table class="data-table"><thead><tr>'
    +'<th>Apellido y Nombre</th><th>DNI</th><th>Grado</th><th>Sección</th><th>Responsable</th><th>Teléfono</th><th>Acciones</th>'
    +'</tr></thead><tbody>';
  lista.forEach(function(a) {
    html += '<tr>'
      +'<td style="font-weight:500">'+a.apellido+', '+a.nombre+'</td>'
      +'<td>'+a.dni+'</td>'
      +'<td style="text-align:center">'+a.grado+'°</td>'
      +'<td style="text-align:center">'+a.seccion+'</td>'
      +'<td>'+a.nombre_responsable+'</td>'
      +'<td>'+a.telefono_responsable+'</td>'
      +'<td><button class="btn btn-outline btn-sm" onclick=\'verAlumno('+JSON.stringify(a)+')\'>👁 Ver</button></td>'
      +'</tr>';
  });
  html += "</tbody></table></div>";
  document.getElementById("alumnosTabla").innerHTML = html;
}

var obsAlumnosCache = [];

function cargarAlumnosObs() {
  var grado   = document.getElementById("obsGrado").value;
  var seccion = document.getElementById("obsSeccion").value;
  var informe = document.getElementById("obsInforme").value;
  var cont    = document.getElementById("obsAlumnosList");
  cont.innerHTML = '<p style="color:var(--text-light);font-size:13px">Cargando...</p>';

  callBackend("getAlumnos", {grado: grado, seccion: seccion}, function(resA) {
    if (!resA.ok || resA.data.length === 0) {
      cont.innerHTML = '<div class="alert alert-info">Sin alumnos para este grado/sección.</div>';
      return;
    }
    obsAlumnosCache = resA.data;
    // Cargar observaciones existentes para este informe
    callBackend("getObservaciones", {ciclo_lectivo: APP.cicloLectivo, informe_nro: informe}, function(resO) {
      var obsMap = {};
      if (resO.ok) {
        resO.data.forEach(function(o) { obsMap[o.id_alumno] = o.texto; });
      }
      var html = '';
      obsAlumnosCache.forEach(function(a) {
        var textoExistente = obsMap[a.id_alumno] || '';
        html +=
          '<div class="obs-alumno-row" id="obsRow_'+a.id_alumno+'">' +
            '<div class="obs-alumno-nombre">'+a.apellido+', '+a.nombre+' &nbsp;<span style="font-weight:400;color:var(--text-light);font-size:11px">'+a.grado+'° '+a.seccion+'</span></div>' +
            '<textarea class="obs-textarea" id="obsText_'+a.id_alumno+'" placeholder="Escribí las observaciones del docente para este período...">'+textoExistente+'</textarea>' +
            '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px">' +
              '<button class="btn btn-outline btn-sm" onclick="guardarObsAlumno(\''+a.id_alumno+'\',\''+a.apellido+' '+a.nombre+'\',\''+a.grado+'\',\''+a.seccion+'\')">💾 Guardar esta obs.</button>' +
              '<span class="obs-guardado" id="obsOk_'+a.id_alumno+'">✅ Guardado</span>' +
            '</div>' +
          '</div>';
      });
      html += '<div style="margin-top:16px;display:flex;justify-content:flex-end">' +
        '<button class="btn btn-primary" onclick="guardarTodasObs()">💾 Guardar todas las observaciones</button>' +
      '</div>';
      cont.innerHTML = html;
    });
  });
}

function guardarObsAlumno(id_alumno, apellido_nombre, grado, seccion) {
  var informe = document.getElementById("obsInforme").value;
  var texto   = document.getElementById("obsText_" + id_alumno).value;
  var okEl    = document.getElementById("obsOk_" + id_alumno);
  callBackend("guardarObservacion", {
    id_alumno:      id_alumno,
    apellido_nombre: apellido_nombre,
    grado:          grado,
    seccion:        seccion,
    informe_nro:    informe,
    texto:          texto,
    ciclo_lectivo:  APP.cicloLectivo
  }, function(res) {
    if (res.ok) {
      okEl.style.display = "inline";
      setTimeout(function(){ okEl.style.display = "none"; }, 2500);
    } else {
      toast("❌ Error al guardar: " + res.error);
    }
  });
}

function guardarTodasObs() {
  var informe  = document.getElementById("obsInforme").value;
  var pendientes = obsAlumnosCache.length;
  var guardadas  = 0;
  var errores    = 0;
  if (pendientes === 0) { toast("No hay alumnos cargados"); return; }
  toast("Guardando " + pendientes + " observaciones...");
  obsAlumnosCache.forEach(function(a) {
    var texto = document.getElementById("obsText_" + a.id_alumno);
    if (!texto) { pendientes--; return; }
    callBackend("guardarObservacion", {
      id_alumno:       a.id_alumno,
      apellido_nombre: a.apellido + " " + a.nombre,
      grado:           a.grado,
      seccion:         a.seccion,
      informe_nro:     informe,
      texto:           texto.value,
      ciclo_lectivo:   APP.cicloLectivo
    }, function(res) {
      if (res.ok) {
        guardadas++;
        var okEl = document.getElementById("obsOk_" + a.id_alumno);
        if (okEl) { okEl.style.display = "inline"; setTimeout(function(){ okEl.style.display = "none"; }, 2500); }
      } else { errores++; }
      if (guardadas + errores === pendientes) {
        if (errores === 0) toast("✅ Todas las observaciones guardadas (" + guardadas + ")");
        else toast("⚠️ Guardadas: " + guardadas + " / Errores: " + errores);
      }
    });
  });
}

var BOLETIN_PDF_URL_1ER_CICLO = "https://raw.githubusercontent.com/peritoprimaria-stack/pm-digital-primaria/main/BOLETIN_PRIMER_CICLO.pdf";
var BOLETIN_PDF_URL_2DO_CICLO = "https://raw.githubusercontent.com/peritoprimaria-stack/pm-digital-primaria/main/boletin_digital_segundo_ciclo.pdf";

function verBoletin(id_alumno) {
  toast("Generando boletín...");
  callBackend("generarBoletin", {id_alumno: id_alumno, ciclo_lectivo: APP.cicloLectivo}, function(res) {
    if (!res.ok) { toast("❌ " + res.error); return; }
    var d = res.data.datos_pdf;
    if (!d) { toast("❌ Sin datos para generar PDF"); return; }
    generarBoletinPDFOficial(d, res.data.alumno);
  });
}

async function generarBoletinPDFOficial(d, alumno) {
  try {
    var { PDFDocument, rgb, StandardFonts } = PDFLib;
    var grado = parseInt(d.grado);
    var esPrimerCiclo = grado <= 3;

    // Cargar el PDF base según el ciclo
    var urlPDF = esPrimerCiclo ? BOLETIN_PDF_URL_1ER_CICLO : BOLETIN_PDF_URL_2DO_CICLO;
    var resp = await fetch(urlPDF);
    if (!resp.ok) throw new Error("No se pudo cargar el PDF base");
    var pdfBytes = await resp.arrayBuffer();

    var pdfDoc = await PDFDocument.load(pdfBytes);
    var font   = await pdfDoc.embedFont(StandardFonts.Helvetica);
    var pages  = pdfDoc.getPages();
    var PH     = 663.449;

    function txt(pageIdx, x, topY, text, size) {
      if (!text || pageIdx >= pages.length) return;
      var s = size || 8;
      pages[pageIdx].drawText(String(text), {
        x: x, y: PH - topY - s, size: s, font: font, color: rgb(0,0,0)
      });
    }

    function txtWrap(pageIdx, x, topY, maxW, text, size) {
      if (!text || pageIdx >= pages.length) return;
      var s = size || 7, charW = s * 0.52, lineH = s * 1.5;
      var maxCh = Math.floor(maxW / charW);
      var words = text.split(' '), line = '', curY = topY, lCount = 0, maxL = 5;
      words.forEach(function(w) {
        if (lCount >= maxL) return;
        var test = line ? line + ' ' + w : w;
        if (test.length > maxCh && line) {
          txt(pageIdx, x, curY, line, s); line = w; curY += lineH; lCount++;
        } else { line = test; }
      });
      if (line && lCount < maxL) txt(pageIdx, x, curY, line, s);
    }

    // ── PÁGINA 1: Datos del alumno (igual en ambos ciclos) ───────
    txt(0, 653, 162, d.apellido,          9.5);
    txt(0, 653, 191, d.nombre,            9.5);
    txt(0, 653, 220, d.dni,               9.5);
    txt(0, 653, 249, d.fecha_nacimiento,  9.5);
    txt(0, 653, 278, d.lugar_nacimiento,  9.5);
    txt(0, 653, 307, d.domicilio,         9.5);
    txt(0, 653, 336, d.establecimiento,   9);
    txt(0, 653, 365, d.domicilio_escuela, 9.5);
    txt(0, 653, 394, d.distrito,          9.5);

    // Columnas X e Y de áreas (iguales en ambos ciclos)
    var CI = { i1:160, i2:222, i3:284, pe:346, if_:409 };

    // Filas Y — 1er ciclo (sin Inglés)
    var FY1 = {
      PRACTICAS_LENGUAJE:136, MATEMATICA:163, CIENCIAS_SOCIALES:190,
      CIENCIAS_NATURALES:217, ED_ARTISTICA:244, ED_FISICA:271
    };
    // Filas Y — 2do ciclo (con Inglés entre Ed.Artística y Ed.Física)
    var FY2 = {
      PRACTICAS_LENGUAJE:136, MATEMATICA:163, CIENCIAS_SOCIALES:190,
      CIENCIAS_NATURALES:217, ED_ARTISTICA:244, ED_FISICA:271, INGLES:298
    };

    function dibujarPagina(pageIdx, FY, areas) {
      // Encabezado: ciclo lectivo (2 dígitos) y sección
      txt(pageIdx, 258, 64, d.ciclo_lectivo.toString().slice(-2), 10);
      txt(pageIdx, 378, 64, d.seccion, 10);
      // Calificaciones
      areas.forEach(function(area) {
        var cal = d.calificaciones[area] || {};
        var y   = FY[area];
        if (cal.i1)  txt(pageIdx, CI.i1  - 6, y, cal.i1,  8);
        if (cal.i2)  txt(pageIdx, CI.i2  - 6, y, cal.i2,  8);
        if (cal.i3)  txt(pageIdx, CI.i3  - 6, y, cal.i3,  8);
        if (cal.pe)  txt(pageIdx, CI.pe  - 6, y, cal.pe,  8);
        if (cal.if_) txt(pageIdx, CI.if_ - 6, y, cal.if_, 8);
      });
      // Inasistencias
      txt(pageIdx, CI.i1 - 6, esPrimerCiclo ? 334 : 361, d.inasistencias, 8);
      // Observaciones
      txtWrap(pageIdx, 492, 182, 408, d.observaciones.obs_1,     8.5);
      txtWrap(pageIdx, 492, 265, 408, d.observaciones.obs_2,     8.5);
      txtWrap(pageIdx, 492, 345, 408, d.observaciones.obs_3,     8.5);
      txtWrap(pageIdx, 492, 422, 408, d.observaciones.obs_pe,    8.5);
      txtWrap(pageIdx, 492, 497, 408, d.observaciones.obs_final, 8.5);
    }

    if (esPrimerCiclo) {
      // 1er ciclo: solo página 2 (grado 1°, 2° o 3°)
      var areas1 = ["PRACTICAS_LENGUAJE","MATEMATICA","CIENCIAS_SOCIALES","CIENCIAS_NATURALES","ED_ARTISTICA","ED_FISICA"];
      dibujarPagina(1, FY1, areas1);

    } else {
      // 2do ciclo: página según grado
      // Página 2 = 4°, Página 3 = 5°, Página 4 = 6°
      var areas2 = ["PRACTICAS_LENGUAJE","MATEMATICA","CIENCIAS_SOCIALES","CIENCIAS_NATURALES","ED_ARTISTICA","ED_FISICA","INGLES"];
      var pageIdx = grado === 4 ? 1 : grado === 5 ? 2 : 3;
      dibujarPagina(pageIdx, FY2, areas2);
    }

    // ── Descargar ────────────────────────────────────────────
    var pdfBytesOut = await pdfDoc.save();
    var blob = new Blob([pdfBytesOut], { type: 'application/pdf' });
    var url  = URL.createObjectURL(blob);
    var nombreArchivo = 'boletin_' + (alumno.apellido||'').replace(/\s+/g,'_').toLowerCase()
                      + '_' + d.ciclo_lectivo + '.pdf';
    var a = document.createElement('a');
    a.href = url; a.download = nombreArchivo; a.target = '_blank';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
    toast("✅ Boletín PDF descargado");

  } catch(err) {
    console.error("Error generando PDF:", err);
    toast("⚠️ Abriendo boletín en pantalla (no se pudo generar PDF)");
    callBackend("generarBoletin", {id_alumno: alumno.id_alumno, ciclo_lectivo: APP.cicloLectivo}, function(res) {
      if (res.ok) { var win = window.open("","_blank"); win.document.write(res.data.html); win.document.close(); }
    });
  }
}

    var l = res.data;
    callBackend("getHistorial", {id_legajo: id}, function(resH) {
      var histHtml = resH.ok && resH.data.length > 0
        ? resH.data.map(function(h) {
            return '<div style="border-left:3px solid var(--primary);padding:8px 12px;margin-bottom:8px;background:#f9f9f9;border-radius:0 6px 6px 0">'
              +'<div style="font-size:12px;color:var(--text-light)">'+h.fecha+' · '+h.tipo_intervencion+' · '+h.profesional+'</div>'
              +'<div style="font-size:13px;margin-top:4px">'+h.descripcion+'</div></div>';
          }).join("")
        : '<p style="color:var(--text-light);font-size:13px">Sin entradas en el historial.</p>';

      abrirModal("📂 Legajo — " + l.apellido_nombre,
        `<div class="form-grid" style="margin-bottom:12px">
          <div><b>Grado:</b> ${l.grado}° ${l.seccion}</div>
          <div><b>Estado:</b> <span class="estado-badge estado-${l.estado}">${l.estado}</span></div>
          <div><b>Apertura:</b> ${l.fecha_apertura}</div>
          <div><b>Profesional:</b> ${l.profesional_a_cargo}</div>
          <div><b>Tipo:</b> ${l.tipo}</div>
          <div><b>Motivo:</b> ${l.motivo}</div>
        </div>
        ${l.observaciones ? '<div class="alert alert-info" style="margin-bottom:12px">'+l.observaciones+'</div>' : ''}
        <h4 style="color:var(--primary);margin-bottom:8px">Historial de intervenciones</h4>

        <h4 style="color:var(--primary);margin-bottom:8px">+ Nueva entrada</h4>
        <div class="form-group"><label class="form-label">Tipo de intervención</label>

        [{label:"💾 Agregar entrada", cls:"btn-primary", fn:'agregarEntradaHistorial("'+id+'","'+l.id_alumno+'")'}]
      );
    });
  });
}

function agregarEntradaHistorial(idLegajo, idAlumno) {
  var data = {
    id_legajo: idLegajo,
    id_alumno: idAlumno,
    tipo_intervencion: v("hTipo"),
    descripcion: v("hDesc")
  };
  if (!data.descripcion) { toast("Escribí la descripción"); return; }
  callBackend("agregarHistorial", data, function(res) {
    if (res.ok) {
      cerrarModal();
      toast("✅ Entrada agregada");
      cargarLegajos();
    } else toast("❌ " + res.error);
  });
}

    '<div id="legAlumnoSelectorWrap" style="display:none;margin-bottom:12px">' +
      '<div class="form-group">' +
        '<label class="form-label">Alumno/a *</label>' +
        '<select id="legAlumnoSel" class="form-control" onchange="seleccionarAlumnoDesdeSel()">' +
          '<option value="">— Seleccioná un alumno —</option>' +
        '</select>' +
      '</div>' +
    '</div>' +
    // ── Datos del legajo (aparecen tras seleccionar alumno) ──
    '<div id="legDatos" style="display:none">' +
      '<div class="alert alert-success" id="legSelConfirm" style="margin-bottom:12px"></div>' +
      '<div class="form-group"><label class="form-label">Motivo de apertura</label>' +
        '<textarea id="legMotivo" class="form-control" rows="2"></textarea></div>' +
      '<div class="form-group"><label class="form-label">Tipo</label>' +
        '<select id="legTipo" class="form-control">' +
          '<option>Seguimiento pedag\u00f3gico</option>' +
          '<option>Problem\u00e1tica familiar</option>' +
          '<option>Salud</option>' +
          '<option>Ausentismo</option>' +
          '<option>Otro</option>' +
        '</select></div>' +
    '</div>',
    [{label:"💾 Crear legajo", cls:"btn-primary", fn:"crearLegajoSubmit()"}]
  );

  // Pre-cargar todos los alumnos en caché para filtrar localmente
  callBackend("getAlumnos", {ciclo_lectivo: APP.cicloLectivo}, function(res) {
    if (res.ok && res.data && res.data.length > 0) {
      _legAlumnosCache = res.data;
    } else {
      // Fallback: intentar sin filtro de ciclo
      callBackend("getAlumnos", {}, function(res2) {
        if (res2.ok && res2.data) _legAlumnosCache = res2.data;
      });
    }
  });
}

function filtrarAlumnosPorCurso() {
  // Limpiar selección anterior si el usuario cambia curso
  LEGAJO_ALUMNO_SEL = {id: "", nombre: "", grado: "", seccion: ""};
  var datosEl = document.getElementById("legDatos");
  if (datosEl) datosEl.style.display = "none";

  var grado   = v("legGradoSel");
  var seccion = v("legSeccionSel");
  var wrap    = document.getElementById("legAlumnoSelectorWrap");
  var selEl   = document.getElementById("legAlumnoSel");
  if (!grado || !seccion) {
    if (wrap)  wrap.style.display  = "none";
    return;
  }

  // Filtrar caché local
  var filtrados = _legAlumnosCache.filter(function(a) {
    return String(a.grado) === String(grado) && String(a.seccion).toUpperCase() === seccion.toUpperCase();
  });

  // Construir opciones
  selEl.innerHTML = '<option value="">— Seleccioná un alumno —</option>';
  if (filtrados.length === 0) {
    selEl.innerHTML += '<option value="" disabled>No hay alumnos en este curso</option>';
  } else {
    filtrados.sort(function(a,b){ return (a.apellido+a.nombre).localeCompare(b.apellido+b.nombre); });
    filtrados.forEach(function(a) {
      var opt = document.createElement("option");
      opt.value = JSON.stringify({id: String(a.id_alumno), nombre: a.apellido+", "+a.nombre, grado: String(a.grado), seccion: a.seccion});
      opt.textContent = a.apellido + ", " + a.nombre;
      selEl.appendChild(opt);
    });
  }

  if (wrap) wrap.style.display = "block";

  // Si el caché está vacío pedirlo ahora (primera vez sin internet rápido)
  if (_legAlumnosCache.length === 0) {
    selEl.innerHTML = '<option value="" disabled>Cargando alumnos...</option>';
    callBackend("getAlumnos", {ciclo_lectivo: APP.cicloLectivo}, function(res) {
      _legAlumnosCache = (res.ok && res.data) ? res.data : [];
      // Reintentar con los datos frescos
      filtrarAlumnosPorCurso();
    });
  }
}

function seleccionarAlumnoDesdeSel() {
  var raw = v("legAlumnoSel");
  if (!raw) {
    var datosEl = document.getElementById("legDatos");
    if (datosEl) datosEl.style.display = "none";
    LEGAJO_ALUMNO_SEL = {id: "", nombre: "", grado: "", seccion: ""};
    return;
  }
  try {
    var alumno = JSON.parse(raw);
    seleccionarAlumnoLegajo(alumno.id, alumno.nombre, alumno.grado, alumno.seccion);
  } catch(e) { /* valor inválido */ }
}

function buscarAlumnoLegajo() {
  // Función mantenida por compatibilidad (ya no se usa en el nuevo modal)
  if (LEGAJO_ALUMNO_SEL.id) {
    LEGAJO_ALUMNO_SEL = {id: "", nombre: "", grado: "", seccion: ""};
    var datosEl = document.getElementById("legDatos");
    if (datosEl) datosEl.style.display = "none";
  }
  clearTimeout(_legBusqTimer);
  var q = v("legBusqueda").trim().toLowerCase();
  if (q.length < 2) {
    var el = document.getElementById("legAlumnoResultados");
    if (el) el.innerHTML = '';
    return;
  }
  if (_legAlumnosCache.length > 0) {
    mostrarResultadosLegajo(_legAlumnosCache, q);
    return;
  }
  _legBusqTimer = setTimeout(function() {
    var el = document.getElementById("legAlumnoResultados");
    if (el) el.innerHTML = '<div style="color:var(--text-light);font-size:13px;padding:8px">Buscando...</div>';
    callBackend("getAlumnos", {ciclo_lectivo: APP.cicloLectivo}, function(res) {
      _legAlumnosCache = (res.ok && res.data) ? res.data : [];
      var qActual = v("legBusqueda").trim().toLowerCase();
      if (qActual.length >= 2) mostrarResultadosLegajo(_legAlumnosCache, qActual);
    });
  }, 350);
}

function mostrarResultadosLegajo(lista, q) {
  var el = document.getElementById("legAlumnoResultados");
  if (!el) return;
  var filtrados = lista.filter(function(a) {
    return (a.apellido + " " + a.nombre).toLowerCase().includes(q);
  }).slice(0, 8);
  if (filtrados.length === 0) {
    el.innerHTML = '<div style="color:#999;font-size:13px;padding:8px">No se encontraron alumnos con ese apellido.</div>';
    return;
  }
  el.innerHTML = "";
  filtrados.forEach(function(a) {
    var div = document.createElement("div");
    div.style.cssText = "padding:10px 12px;cursor:pointer;border:1px solid #ddd;border-radius:6px;margin-bottom:6px;background:#fff;transition:.15s";
    div.innerHTML = "<b>" + a.apellido + ", " + a.nombre + "</b>"
      + " <span style='color:#999;font-size:12px'>— " + a.grado + "° " + a.seccion + "</span>";
    div.onmouseover = function(){ this.style.background = "#fff5f5"; this.style.borderColor = "var(--primary)"; };
    div.onmouseout  = function(){ this.style.background = "#fff"; this.style.borderColor = "#ddd"; };
    // Capturar todos los datos del alumno en el closure
    (function(alumno) {
      div.onclick = function() {
        seleccionarAlumnoLegajo(
          String(alumno.id_alumno),
          alumno.apellido + ", " + alumno.nombre,
          String(alumno.grado),
          alumno.seccion
        );
      };
    })(a);
    el.appendChild(div);
  });
}

function seleccionarAlumnoLegajo(id, nombre, grado, seccion) {
  if (!id) { toast("Error: el alumno no tiene ID. Contactá al administrador."); return; }
  LEGAJO_ALUMNO_SEL = {id: id, nombre: nombre, grado: grado, seccion: seccion};
  // Limpiar resultados y mostrar confirmación
  var resEl = document.getElementById("legAlumnoResultados");
  if (resEl) resEl.innerHTML = '';
  var buscEl = document.getElementById("legBusqueda");
  if (buscEl) buscEl.value = nombre;
  // Mostrar sección de datos del legajo con confirmación del alumno elegido
  var confirmEl = document.getElementById("legSelConfirm");
  if (confirmEl) confirmEl.innerHTML = '✅ Alumno seleccionado: <b>' + nombre + '</b> — ' + grado + '° ' + seccion;
  var datosEl = document.getElementById("legDatos");
  if (datosEl) datosEl.style.display = "block";
}

function crearLegajoSubmit() {
  var idAlumno     = LEGAJO_ALUMNO_SEL.id;
  var nombreAlumno = LEGAJO_ALUMNO_SEL.nombre;
  if (!idAlumno) {
    toast("⚠️ Primero buscá y hacé clic en un alumno de la lista");
    // Destacar el campo de búsqueda
    var bEl = document.getElementById("legBusqueda");
    if (bEl) { bEl.style.borderColor = "var(--danger)"; setTimeout(function(){ bEl.style.borderColor = ""; }, 2000); }
    return;
  }
  callBackend("crearLegajo", {
    id_alumno:       idAlumno,
    apellido_nombre: nombreAlumno,
    grado:           LEGAJO_ALUMNO_SEL.grado,
    seccion:         LEGAJO_ALUMNO_SEL.seccion,
    motivo:          v("legMotivo"),
    tipo:            v("legTipo")
  }, function(res) {
    if (res.ok) {
      LEGAJO_ALUMNO_SEL = {id: "", nombre: "", grado: "", seccion: ""};
      _legAlumnosCache = [];
      cerrarModal();
      toast("✅ Legajo creado");
      cargarLegajos();
    } else toast("❌ " + res.error);
  });
}

function mostrarTabReporte(tab) {
  ["asist","doc","accid"].forEach(function(t) {

    var btn = document.getElementById("tab" + (t==="asist"?"Asist":t==="doc"?"Doc":"Accid"));
    if (el) el.style.display = t === tab ? "block" : "none";
    if (btn) { btn.className = t === tab ? "btn btn-primary" : "btn btn-outline"; }
  });
}

function generarReporteAsistencia() {
  var grado    = document.getElementById("rpGrado").value;
  var seccion  = document.getElementById("rpSeccion").value;
  var trimestre= document.getElementById("rpTrimestre").value;
  var el       = document.getElementById("rpAsistResult");
  el.innerHTML = "<p style=\"color:var(--text-light);font-size:13px\">Cargando...</p>";

  callBackend("getReporteAsistencia", {
    grado: grado, seccion: seccion, trimestre: trimestre, ciclo_lectivo: APP.cicloLectivo
  }, function(res) {
    if (!res.ok || !res.data || res.data.length === 0) {
      el.innerHTML = "<div class=\"alert alert-info\">Sin datos para los filtros seleccionados.</div>";
      return;
    }
    var trimLabel = TRIMESTRES[(parseInt(trimestre)||1)-1].label;
    var enRiesgo  = res.data.filter(function(a){ return a.ausentes >= UMBRAL_RIESGO; });
    var html = "";

    if (enRiesgo.length > 0) {
      html += "<div class=\"alert alert-warning\" style=\"margin-bottom:12px\">" +
        "<strong>⚠️ Alumnos que podrían pasar a período de intensificación ("+trimLabel+"):</strong><br>" +
        enRiesgo.map(function(a){
          return "• <strong>"+a.apellido_nombre+"</strong> — "+a.grado+"°"+a.seccion+" — "+a.ausentes+" inasistencias";
        }).join("<br>") +
      "</div>";
    }

    html += "<div class=\"table-container\"><table class=\"data-table\">" +
      "<thead><tr>" +
        "<th>Alumno/a</th><th>Grado</th>" +
        "<th style=\"text-align:center\">Presentes</th>" +
        "<th style=\"text-align:center;color:var(--danger)\">Ausentes</th>" +
        "<th style=\"text-align:center;color:var(--warning)\">Tardes</th>" +
        "<th style=\"text-align:center\">% Asistencia</th>" +
        "<th>Estado</th>" +
      "</tr></thead><tbody>";

    res.data.forEach(function(a) {
      var riesgo = a.ausentes >= UMBRAL_RIESGO;
      var pct    = a.porcentaje || 0;
      html += "<tr style=\"" + (riesgo?"background:rgba(220,53,69,.04)":"") + "\">" +
        "<td><strong>"+a.apellido_nombre+"</strong></td>" +
        "<td style=\"text-align:center\">"+a.grado+"°"+a.seccion+"</td>" +
        "<td style=\"text-align:center\">"+a.presentes+"</td>" +
        "<td style=\"text-align:center;font-weight:600;color:var(--danger)\">"+a.ausentes+"</td>" +
        "<td style=\"text-align:center;color:var(--warning)\">"+a.tardes+"</td>" +
        "<td><span style=\"font-weight:600;color:"+(riesgo?"var(--danger)":pct>=85?"var(--success)":"var(--warning)")+"\">"+pct+"%</span></td>" +
        "<td>"+(riesgo
          ? "<span class=\"badge badge-A\">⚠ Intensificación</span>"
          : "<span class=\"badge badge-P\">✓ Regular</span>"
        )+"</td>" +
      "</tr>";
    });
    html += "</tbody></table></div>";
    html += "<button class=\"btn btn-outline\" style=\"margin-top:8px\" onclick=\"imprimirReporteAsistencia()\">🖨️ Imprimir / Guardar PDF</button>";
    el.innerHTML = html;

    // Guardar datos para el PDF
    window._lastReporteAsist = { data: res.data, trimLabel: trimLabel, grado: grado, seccion: seccion, enRiesgo: enRiesgo };
  });
}

function imprimirReporteAsistencia() {
  var r = window._lastReporteAsist;
  if (!r) return;
  var filtroStr = (r.grado ? r.grado+"°" : "Todos los grados") + (r.seccion ? " — Sección "+r.seccion : " — Todas las secciones") + " — " + r.trimLabel;
  var subtitulo = "Reporte de Asistencia de Alumnos &nbsp;|&nbsp; " + filtroStr;
  var html = _cabeceraReporte("Reporte de Asistencia", subtitulo);

  // Resumen
  var totalAlumnos = r.data.length;
  var totalRiesgo  = r.enRiesgo.length;
  var promPct = totalAlumnos > 0 ? Math.round(r.data.reduce(function(s,a){return s+(a.porcentaje||0)},0)/totalAlumnos) : 0;
  html += "<div class='resumen'>" +
    "<span>Total alumnos: <b>"+totalAlumnos+"</b></span>" +
    "<span>En riesgo (≥"+UMBRAL_RIESGO+" inasistencias): <b>"+totalRiesgo+"</b></span>" +
    "<span>Asistencia promedio: <b>"+promPct+"%</b></span>" +
  "</div>";

  if (r.enRiesgo.length > 0) {
    html += "<div class='alerta-box'>⚠️ <strong>Alumnos con posible período de intensificación:</strong> " +
      r.enRiesgo.map(function(a){ return a.apellido_nombre+" ("+a.ausentes+" aus.)"; }).join(" &nbsp;·&nbsp; ") +
    "</div>";
  }

  html += "<table><thead><tr>" +
    "<th>Alumno/a</th><th>Grado</th><th style='text-align:center'>Presentes</th>" +
    "<th style='text-align:center'>Ausentes</th><th style='text-align:center'>Tardes</th>" +
    "<th style='text-align:center'>% Asist.</th><th>Estado</th>" +
  "</tr></thead><tbody>";
  r.data.forEach(function(a) {
    var riesgo = a.ausentes >= UMBRAL_RIESGO;
    var pct = a.porcentaje || 0;
    html += "<tr"+(riesgo?" class='riesgo'":"")+"><td><strong>"+a.apellido_nombre+"</strong></td>" +
      "<td style='text-align:center'>"+a.grado+"°"+a.seccion+"</td>" +
      "<td style='text-align:center'>"+a.presentes+"</td>" +
      "<td style='text-align:center;font-weight:600;color:#C62828'>"+a.ausentes+"</td>" +
      "<td style='text-align:center;color:#F57F17'>"+a.tardes+"</td>" +
      "<td style='text-align:center;font-weight:600'>"+pct+"%</td>" +
      "<td>"+(riesgo?"<span class='badge-risk'>⚠ Intensificación</span>":"<span class='badge-ok'>✓ Regular</span>")+"</td></tr>";
  });
  html += "</tbody></table>";

function generarReporteDocentes() {
  var desde = document.getElementById("rpDocDesde").value;
  var hasta = document.getElementById("rpDocHasta").value;
  var el    = document.getElementById("rpDocResult");
  if (!desde || !hasta) { toast("Completá las fechas"); return; }
  el.innerHTML = "<p style=\"color:var(--text-light);font-size:13px\">Cargando...</p>";

  callBackend("getReporteAusenciasDocentes", {desde: desde, hasta: hasta}, function(res) {
    if (!res.ok || !res.data || res.data.length === 0) {
      el.innerHTML = "<div class=\"alert alert-info\">Sin ausencias en ese período.</div>";
      return;
    }
    var porDocente = {};
    res.data.forEach(function(a) {
      if (!porDocente[a.docente_nombre]) porDocente[a.docente_nombre] = [];
      porDocente[a.docente_nombre].push(a);
    });

    var html = "<div class=\"table-container\"><table class=\"data-table\">" +
      "<thead><tr><th>Docente</th><th>Total ausencias</th><th>Motivos</th><th>Fechas</th></tr></thead><tbody>";

    Object.keys(porDocente).sort().forEach(function(doc) {
      var ausencias = porDocente[doc];
      var motivos   = {};
      ausencias.forEach(function(a){ motivos[a.motivo] = (motivos[a.motivo]||0) + 1; });
      var motivoStr = Object.keys(motivos).map(function(m){ return m+"("+motivos[m]+")"; }).join(", ");
      var fechasStr = ausencias.map(function(a){ return a.fecha; }).join(", ");
      html += "<tr>" +
        "<td><strong>"+doc+"</strong></td>" +
        "<td style=\"text-align:center;font-weight:600;color:var(--danger)\">"+ausencias.length+"</td>" +
        "<td style=\"font-size:12px\">"+motivoStr+"</td>" +
        "<td style=\"font-size:11px;color:var(--text-light)\">"+fechasStr+"</td>" +
      "</tr>";
    });
    html += "</tbody></table></div>";
    html += "<button class=\"btn btn-outline\" style=\"margin-top:8px\" onclick=\"imprimirReporteDocentes()\">🖨️ Imprimir / Guardar PDF</button>";
    el.innerHTML = html;

    window._lastReporteDoc = { data: res.data, desde: desde, hasta: hasta, porDocente: porDocente };
  });
}

    lugar:     v("acLugar"),
