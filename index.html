function mostrarHorario() {
  var grado   = document.getElementById("horGrado").value;
  var seccion = document.getElementById("horSeccion").value;
  var el      = document.getElementById("horarioTabla");
  if (!grado || !seccion) { el.innerHTML = ''; return; }

  var key  = grado + seccion;
  var data = HORARIO_2026[key];
  if (!data) {
    el.innerHTML = '<div class="alert alert-info">No hay horario cargado para '+grado+'°'+seccion+'.</div>';
    return;
  }

  var dias = ['lunes','martes','miercoles','jueves','viernes'];
  var diasLabel = ['Lunes','Martes','Miércoles','Jueves','Viernes'];

  var html = '<p style="color:var(--text-light);font-size:13px;margin-bottom:8px">Turno: <strong>'+data.turno+'</strong>' +
    (data.maestra_titular ? ' &nbsp;|&nbsp; Maestra/o titular: <strong style="color:var(--primary)">'+data.maestra_titular+'</strong>' : '') + '</p>';
  html += '<div class="table-container"><table class="data-table">';
  html += '<thead><tr><th>Hora</th><th>Horario</th>';
  diasLabel.forEach(function(d){ html += '<th>'+d+'</th>'; });
  html += '</tr></thead><tbody>';

  data.horas.forEach(function(h) {
    html += '<tr><td><strong>'+h.hora+'</strong></td><td style="color:var(--text-light);font-size:12px">'+h.rango+'</td>';
    dias.forEach(function(d) {
      var docente = h[d] || '';
      html += '<td>'+(docente ? '<span style="background:var(--primary-light,#fde8e8);color:var(--primary);padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600">'+docente+'</span>' : '<span style="color:#ccc">—</span>')+'</td>';
    });
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  el.innerHTML = html;
}

function cambiarMesAusencias(delta) {
  APP._adMes += delta;
  if (APP._adMes > 11) { APP._adMes = 0;  APP._adAnio++; }
  if (APP._adMes < 0)  { APP._adMes = 11; APP._adAnio--; }
  cargarAusenciasDocentes();
}

function irMesActualAusencias() {
  var h = new Date();
  APP._adMes  = h.getMonth();
  APP._adAnio = h.getFullYear();
  cargarAusenciasDocentes();
}

function cargarAusenciasDocentes() {
  var mes  = APP._adMes;
  var anio = APP._adAnio;
  var desde = anio+"-"+(mes+1<10?"0":"")+(mes+1)+"-01";
  var ultimoDia = new Date(anio, mes+1, 0).getDate();
  var hasta = anio+"-"+(mes+1<10?"0":"")+(mes+1)+"-"+(ultimoDia<10?"0":"")+ultimoDia;

  var label = document.getElementById("adMesLabel");
  var meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  if (label) label.textContent = meses[mes] + " " + anio;

  callBackend("getReporteAusenciasDocentes", {desde: desde, hasta: hasta}, function(res) {
    var data = (res.ok && res.data) ? res.data : [];
    renderCalendarioAusencias(data, mes, anio);
    renderListaAusencias(data);
  });
}

function renderCalendarioAusencias(data, mes, anio) {
  var el = document.getElementById("adCalendario");
  if (!el) return;

  // Agrupar ausencias por fecha — expandir rangos
  var porFecha = {};
  data.forEach(function(a) {
    var d1 = new Date((a.fecha||"")+"T12:00:00");
    var d2 = new Date((a.fecha_hasta||a.fecha||"")+"T12:00:00");
    for (var d = new Date(d1); d <= d2; d.setDate(d.getDate()+1)) {
      var key = d.getFullYear()+"-"+(d.getMonth()+1<10?"0":"")+(d.getMonth()+1)+"-"+(d.getDate()<10?"0":"")+d.getDate();
      if (!porFecha[key]) porFecha[key] = [];
      porFecha[key].push(a.docente_nombre);
    }
  });

  var diasSemana = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  var primerDia  = new Date(anio, mes, 1).getDay();
  var totalDias  = new Date(anio, mes+1, 0).getDate();
  var hoy        = new Date();
  var esEsteMes  = hoy.getMonth()===mes && hoy.getFullYear()===anio;

  var html = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">';

  // Headers días semana
  diasSemana.forEach(function(d) {
    html += '<div style="text-align:center;font-size:11px;font-weight:600;color:var(--text-light);padding:4px">'+d+'</div>';
  });

  // Celdas vacías hasta el primer día
  for (var i = 0; i < primerDia; i++) {
    html += '<div></div>';
  }

  // Días del mes
  for (var dia = 1; dia <= totalDias; dia++) {
    var key = anio+"-"+(mes+1<10?"0":"")+(mes+1)+"-"+(dia<10?"0":"")+dia;
    var ausentes = porFecha[key] || [];
    var esHoy = esEsteMes && hoy.getDate()===dia;

    var bg     = ausentes.length > 0 ? "#fff5f5" : "#fafafa";
    var border = esHoy ? "2px solid #B71C1C" : "1px solid var(--border)";
    var numColor = esHoy ? "#B71C1C" : "#333";

    html += '<div style="min-height:60px;background:'+bg+';border:'+border+';border-radius:6px;padding:4px 5px;font-size:11px">' +
      '<div style="font-weight:600;color:'+numColor+';margin-bottom:2px">'+dia+'</div>';

    ausentes.slice(0,3).forEach(function(nombre) {
      // Mostrar solo apellido para que entre
      var apellido = nombre.split(" ")[0];
      html += '<div style="background:#B71C1C;color:#fff;border-radius:3px;padding:1px 4px;margin-bottom:2px;font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis" title="'+nombre+'">'+apellido+'</div>';
    });
    if (ausentes.length > 3) {
      html += '<div style="color:var(--text-light);font-size:10px">+' + (ausentes.length-3) + ' más</div>';
    }

    html += '</div>';
  }

  html += '</div>';
  el.innerHTML = html;
}

function renderListaAusencias(data) {
  var el = document.getElementById("adLista");
  if (!el) return;
  if (!data || data.length === 0) {
    el.innerHTML = '<div class="alert alert-info">Sin ausencias en este mes.</div>';
    return;
  }
  var html = '<div class="table-container"><table class="data-table"><thead><tr>' +
    '<th>Docente</th><th>Desde</th><th>Hasta</th><th>Días</th><th>Motivo</th><th>Reemplazante</th>' +
    '</tr></thead><tbody>';
  data.forEach(function(a) {
    var d1 = new Date((a.fecha||"")+"T12:00:00");
    var d2 = new Date((a.fecha_hasta||a.fecha||"")+"T12:00:00");
    var dias = Math.round((d2-d1)/(1000*60*60*24))+1;
    html += '<tr>' +

      '<td style="text-align:center;font-weight:600;color:'+(dias>1?"var(--danger)":"inherit")+'">'+dias+'</td>' +
      '<td style="font-size:12px">'+a.motivo+'</td>' +
      '<td style="font-size:12px;color:var(--text-light)">'+(a.reemplazante||'—')+'</td>' +
    '</tr>';
  });
  html += '</tbody></table></div>';
  el.innerHTML = html;
}

function calcularImpactoAusencia(nombreDocente, fecha) {
  // Convierte la fecha en día de la semana
  var diasMap = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
  var d = new Date(fecha + 'T12:00:00');
  var diaSemana = diasMap[d.getDay()];
  if (!diaSemana || diaSemana === 'domingo' || diaSemana === 'sabado') return [];

  var impacto = [];
  var nombreNorm = nombreDocente.toUpperCase().replace(/\.$/,'').trim();

  Object.keys(HORARIO_2026).forEach(function(key) {
    if (key.startsWith('_')) return;
    var curso = HORARIO_2026[key];
    var apellidoNorm = nombreNorm.split(' ')[0];

    // Verificar si es la maestra titular del grado
    if (curso.maestra_titular) {
      var titularNorm = curso.maestra_titular.toUpperCase().split(' ')[0];
      if (apellidoNorm === titularNorm || nombreNorm === curso.maestra_titular.toUpperCase()) {
        impacto.push(key + ' — todas las horas (MG titular)');
        return; // no seguir buscando en las horas del mismo grado
      }
    }

    // Verificar horas especiales
    curso.horas.forEach(function(h) {
      var doc = (h[diaSemana] || '').toUpperCase().replace(/\.$/,'').trim();
      if (doc && (doc.split(' ')[0] === apellidoNorm || doc === nombreNorm)) {
        impacto.push(key + ' ' + h.hora + ' (' + h.rango + ')');
      }
    });
  });
  return impacto;
}

function actualizarHasta() {
  var desde = document.getElementById("adFecha");
  var hasta  = document.getElementById("adFechaHasta");
  if (desde && hasta && hasta.value < desde.value) hasta.value = desde.value;
  calcularDiasAusencia();
}

function calcularDiasAusencia() {
  var desde = v("adFecha");
  var hasta  = v("adFechaHasta");
  var el     = document.getElementById("adDiasInfo");
  if (!desde || !hasta || !el) return;
  var d1 = new Date(desde+"T12:00:00");
  var d2 = new Date(hasta+"T12:00:00");
  var dias = Math.round((d2-d1)/(1000*60*60*24)) + 1;
  if (dias < 1) { document.getElementById("adFechaHasta").value = desde; dias = 1; }
  el.textContent = dias === 1 ? "1 día" : dias + " días de ausencia";
  el.style.color  = dias > 3 ? "var(--danger)" : "var(--text-light)";
}

function toggleOtraAusencia() {
  var motivo = v("adMotivo");
  var wrap   = document.getElementById("adOtraWrap");
  if (wrap) wrap.style.display = motivo === "Otro" ? "block" : "none";
}

function registrarAusenciaDocenteSubmit() {
  var nombre = v("adNombre");
  if (!nombre) { toast("Seleccioná un docente"); return; }
  var desde = v("adFecha");
  var hasta  = v("adFechaHasta");
  if (!desde || !hasta) { toast("Completá las fechas"); return; }
  if (hasta < desde) { toast("La fecha hasta no puede ser anterior a la fecha desde"); return; }

  var motivo = v("adMotivo");
  if (motivo === "Otro") {
    var otra = v("adOtraTexto").trim();
    if (!otra) { toast("Especificá el motivo"); return; }
    motivo = "Otro: " + otra;
  }

  // Si es un solo día, registrar una fila. Si es rango, registrar una fila con fecha_hasta
  callBackend("registrarAusenciaDocente", {
    fecha:           desde,
    fecha_hasta:     hasta,
    docente_nombre:  nombre,
    motivo:          motivo,
    reemplazante:    v("adReemplazante")
  }, function(res) {
    if (res.ok) {
      cerrarModal();
      var d1 = new Date(desde+"T12:00:00");
      var d2 = new Date(hasta+"T12:00:00");
      var dias = Math.round((d2-d1)/(1000*60*60*24))+1;
      toast("✅ Ausencia registrada (" + dias + (dias===1?" día":" días") + ")");
      cargarAusenciasDocentes();
    } else toast("❌ " + res.error);
  });
}

var _reunAlumnosCache = [];

function _opcionesCitadoPor() {
  // Armar lista: primero directivos, luego docentes ordenados
  var usuarioActual = APP.usuario.nombre + " " + APP.usuario.apellido;
  var opciones = [];

  // Directivos desde config
  var nombreDir = (APP.directivoNombre) || (APP.config && APP.config.DIRECTIVO_NOMBRE) || "";
  var cargoDir  = (APP.directivoCargo)  || (APP.config && APP.config.DIRECTIVO_CARGO)  || "Directora";
  if (nombreDir) opciones.push({ valor: nombreDir, label: nombreDir + " — " + cargoDir });

  // Docentes del horario
  var docentes = (HORARIO_2026._docentes || []).slice().sort(function(a,b){
    return a.nombre.localeCompare(b.nombre);
  });
  docentes.forEach(function(d) {
    if (d.nombre !== nombreDir) {
      opciones.push({ valor: d.nombre, label: d.nombre + " — " + d.rol });
    }
  });

  // Si el usuario actual no está en ninguna lista, agregarlo primero
  var estaEnLista = opciones.some(function(o){ return o.valor === usuarioActual; });
  if (!estaEnLista && usuarioActual.trim()) {
    opciones.unshift({ valor: usuarioActual, label: usuarioActual + " — " + APP.usuario.rol });
  }

  return opciones.map(function(o) {
    var sel = o.valor === usuarioActual ? " selected" : "";
    return '<option value="'+o.valor+'"'+sel+'>'+o.label+'</option>';
  }).join('');
}

  var alumnoRaw = v("reunAlumno");
  if (!alumnoRaw) { toast("Seleccioná un alumno"); return; }
  var alumno;
  try { alumno = JSON.parse(alumnoRaw); } catch(e) { toast("Error al leer el alumno"); return; }

  if (motivo === "Otro") {
    var otra = v("reunOtraTexto").trim();
    if (!otra) { toast("Especificá el motivo"); return; }
    motivo = "Otro: " + otra;
  }

  if (!v("reunCitadoPor")) { toast("Completá quién cita"); return; }

  callBackend("registrarReunion", {
    id_alumno:       alumno.id,
    apellido_nombre: alumno.nombre,
    grado:           String(alumno.grado),
    seccion:         alumno.seccion,
    fecha:           v("reunFecha"),
    hora:            v("reunHora"),
    citado_por:      v("reunCitadoPor"),
    motivo:          motivo,
    observaciones:   v("reunObs")
  }, function(res) {
    if (res.ok) {
      cerrarModal();
      toast("✅ Citación registrada");
      cargarReuniones();

      setTimeout(function(){

          imprimirCitacionDirecta(res.data);
        }
      }, 300);
    } else toast("❌ " + res.error);
  });
}

function imprimirCitacion(id) {

    if (!res.ok) { toast("Error al cargar"); return; }
    imprimirCitacionDirecta(res.data);
  });
}

function imprimirCitacionDirecta(r) {
  var esc   = (APP.config && APP.config.NOMBRE_ESCUELA)    || "Escuela Primaria";
  var cue   = (APP.config && APP.config.CUE)               || "";
  var dist  = (APP.config && APP.config.DISTRITO)          || "";
  var dom   = (APP.config && APP.config.DOMICILIO_ESCUELA) || "";

  var fechaObj = new Date(r.fecha + "T12:00:00");
  var meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  var fechaStr = fechaObj.getDate() + " de " + meses[fechaObj.getMonth()] + " de " + fechaObj.getFullYear();

  var hoy = new Date();
  var hoyStr = hoy.getDate() + " de " + meses[hoy.getMonth()] + " de " + hoy.getFullYear();

  var html = "<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><title>Citación — "+r.apellido_nombre+"</title>" +
    "<style>" +
      "*{box-sizing:border-box;margin:0;padding:0}" +
      "body{font-family:Arial,sans-serif;font-size:13px;color:#000;padding:32px 40px;max-width:750px;margin:0 auto}" +
      ".cabecera{text-align:center;border-bottom:2px solid #B71C1C;padding-bottom:12px;margin-bottom:20px}" +
      ".escuela{font-size:18px;font-weight:bold;color:#B71C1C;margin-bottom:4px}" +
      ".meta{font-size:11px;color:#555}" +
      ".fecha-emision{text-align:right;font-size:12px;margin-bottom:20px;color:#555}" +
      ".titulo{text-align:center;font-size:15px;font-weight:bold;text-transform:uppercase;letter-spacing:2px;margin-bottom:24px;color:#212121}" +
      "p{margin-bottom:14px;line-height:1.8}" +
      ".dato{border-bottom:1px solid #000;display:inline-block;min-width:80px;padding:0 4px}" +
      ".motivo-box{border:1px solid #ccc;border-radius:6px;padding:10px 14px;margin:16px 0;background:#fafafa;font-size:13px}" +
      ".firma-bloque{margin-top:48px;display:flex;justify-content:space-between}" +
      ".firma-item{text-align:center;width:42%}" +
      ".firma-linea{border-top:1px solid #000;padding-top:6px;font-size:11px;margin-top:6px}" +
      ".no-print{text-align:center;margin:20px 0}" +
      ".btn-imp{padding:10px 24px;background:#B71C1C;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer}" +
      "@media print{.no-print{display:none}}" +
    "</style></head><body>" +

    "<div class='cabecera'>" +
      "<div class='escuela'>"+esc+"</div>" +
      "<div class='meta'>"+(cue?"CUE: "+cue+" &nbsp;|&nbsp; ":"")+(dist?"Distrito: "+dist+" &nbsp;|&nbsp; ":"")+(dom?dom:"")+"</div>" +
    "</div>" +

    "<div class='fecha-emision'>"+esc+", "+hoyStr+"</div>" +

    "<div class='titulo'>Citación a Padres / Tutores</div>" +

    "<p>Por medio de la presente, se cita al padre/madre o tutor/a del alumno/a:</p>" +

    "<p style='font-size:15px;font-weight:bold;text-align:center;margin:16px 0'>" +
      r.apellido_nombre + " &nbsp;—&nbsp; " + r.grado + "° " + r.seccion +
    "</p>" +

    "<p>Se solicita su presencia en el establecimiento el día <span class='dato'>"+fechaStr+"</span>" +
    (r.hora ? " a las <span class='dato'>"+r.hora+"</span> hs." : "") + ".</p>" +

    "<p><strong>Motivo de la citación:</strong></p>" +
    "<div class='motivo-box'>"+r.motivo+"</div>" +

    (r.observaciones
      ? "<p><strong>Observaciones:</strong><br>"+r.observaciones+"</p>"
      : "") +

    "<p>Ante cualquier inconveniente para concurrir en el horario indicado, comuníquese con la institución para coordinar una nueva fecha.</p>" +

    "<div class='firma-bloque'>" +
      "<div class='firma-item'>" +
        (APP.firmaBase64 ? "<img src='"+APP.firmaBase64+"' style='max-height:50px;max-width:160px;display:block;margin:0 auto 4px'>" : "<div style='height:50px'></div>") +
        "<div class='firma-linea'>"+(APP.directivoNombre||"")+"<br><strong>"+(APP.directivoCargo||"Directora")+"</strong></div>" +
      "</div>" +
      "<div class='firma-item'>" +
        "<div style='height:50px'></div>" +
        "<div class='firma-linea'>Firma y aclaración del padre/madre o tutor/a</div>" +
      "</div>" +
    "</div>" +

    "<div class='no-print'><button class='btn-imp' onclick='window.print()'>🖨️ Imprimir / Guardar PDF</button></div>" +
    "</body></html>";

  var win = window.open("","_blank");
  win.document.write(html);
  win.document.close();
}

      return '<div class="msg-item'+(leido?'':' unread')+'" onclick=\'verMensaje('+JSON.stringify(m)+')\' >'

        +'<div class="msg-meta">De: '+m.de+' · Para: '+m.para+' · '+m.fecha+'</div>'
        +'</div>';
    }).join("");
    document.getElementById("mensajesList").innerHTML = html;
  });
}

      <b>De:</b> ${m.de} · <b>Para:</b> ${m.para} · <b>Fecha:</b> ${m.fecha}

function guardarConfiguracion() {
  callBackend("guardarConfig", {
    NOMBRE_ESCUELA:    v("cfgNombre"),
    CUE:               v("cfgCue"),
    DISTRITO:          v("cfgDistrito"),
    DOMICILIO_ESCUELA: v("cfgDomicilio"),
    CICLO_LECTIVO:     v("cfgCiclo"),
    TURNO:             v("cfgTurno"),
    COLOR_PRIMARIO:    v("cfgColor")
  }, function(res) {
    if (res.ok) toast("✅ Configuración guardada");
    else toast("❌ " + res.error);
  });
}

function cargarFirmaPreview(input) {
  if (!input.files || !input.files[0]) return;
  var file = input.files[0];
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = document.getElementById("firmaImg");
    var ph  = document.getElementById("firmaPlaceholder");
    var btn = document.getElementById("btnBorrarFirma");
    img.src = e.target.result;
    img.style.display = "block";
    if (ph) ph.style.display = "none";
    if (btn) btn.style.display = "inline-flex";
    APP.firmaBase64 = e.target.result;
  };
  reader.readAsDataURL(file);
}

function borrarFirma() {
  var img = document.getElementById("firmaImg");
  var ph  = document.getElementById("firmaPlaceholder");
  var btn = document.getElementById("btnBorrarFirma");
  var fi  = document.getElementById("firmaFile");
  if (img) { img.src=""; img.style.display="none"; }
  if (ph)  ph.style.display = "block";
  if (btn) btn.style.display = "none";
  if (fi)  fi.value = "";
  APP.firmaBase64 = null;
}

function guardarFirmaConfig() {
  var nombre = v("cfgDirectivoNombre");
  var cargo  = v("cfgDirectivoCargo");
  if (!APP.firmaBase64 && !nombre && !cargo) { toast("No hay nada para guardar"); return; }

  // Separar prefijo data:image/...;base64, del contenido puro
  var base64puro = "";
  var tipo = "image/png";
  if (APP.firmaBase64) {
    var partes = APP.firmaBase64.split(",");
    base64puro = partes[1] || "";
    var match = partes[0].match(/data:(image\/\w+);base64/);
    if (match) tipo = match[1];
  }

  toast("Guardando firma en Drive...");
  callBackend("guardarFirma", {
    base64: base64puro,
    tipo:   tipo,
    nombre: nombre,
    cargo:  cargo
  }, function(res) {
    if (res.ok) {
      APP.directivoNombre = nombre;
      APP.directivoCargo  = cargo;
      toast("✅ Firma guardada en Drive");
    } else {
      toast("❌ " + res.error);
    }
  });
}

function inicializarFirmaGuardada() {
  // Cargar firma desde Drive al iniciar la app
  callBackend("getFirma", {}, function(res) {
    if (res.ok && res.data && res.data.firma) {
      APP.firmaBase64 = res.data.firma;
    }
  });
}

// Al mostrar la pantalla de config, si ya hay firma guardada, mostrarla
function mostrarFirmaEnConfig() {
  if (!APP.firmaBase64) return;
  var img = document.getElementById("firmaImg");
  var ph  = document.getElementById("firmaPlaceholder");
  var btn = document.getElementById("btnBorrarFirma");
  if (img) { img.src = APP.firmaBase64; img.style.display = "block"; }
  if (ph)  ph.style.display = "none";
  if (btn) btn.style.display = "inline-flex";
}

// Inyectar firma en HTML de reportes impresos
function _bloquesFirmaHTML() {
  var nombre  = APP.directivoNombre || (APP.config && APP.config.DIRECTIVO_NOMBRE) || "";
  var cargo   = APP.directivoCargo  || (APP.config && APP.config.DIRECTIVO_CARGO)  || "Directora/Director";
  var imgHtml = APP.firmaBase64

    "</div>" +
  "</div>";
}

function abrirModal(titulo, cuerpo, botones) {
  document.getElementById("modalTitle").textContent = titulo;
  document.getElementById("modalBody").innerHTML = cuerpo;
  var footer = document.getElementById("modalFooter");
  footer.innerHTML = '<button class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>';
  (botones||[]).forEach(function(b) {
    if (b.show === false) return;
    var btn = document.createElement("button");
    btn.className = "btn " + (b.cls||"btn-primary");
    btn.textContent = b.label;
    btn.setAttribute("onclick", b.fn);
    footer.appendChild(btn);
  });
  document.getElementById("modalOverlay").classList.add("open");
}

function cerrarModal() {
  document.getElementById("modalOverlay").classList.remove("open");
}

function v(id) {
  var el = document.getElementById(id);
  return el ? el.value : "";
}

function fechaHoy() {
  return new Date().toISOString().split("T")[0];
}

function toast(msg, dur) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, dur||3000);
}

function mostrarError(msg) {
  var t = document.getElementById("toast");
  t.style.background = "#C62828";
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); t.style.background="#323232"; }, 5000);
}

// BACKEND CALL
// ════════════════════════════════════════════════════════════
function callBackend(accion, data, callback) {
  var token = APP.usuario ? APP.usuario.email : "";
  
  // Construir URL con parámetros GET (evita CORS con Apps Script)
  var params = Object.assign({}, data, {accion: accion, token: token});
  var qs = Object.keys(params).map(function(k) {
    var val = params[k];
    if (typeof val === "object") val = JSON.stringify(val);
    return encodeURIComponent(k) + "=" + encodeURIComponent(val || "");
  }).join("&");
  
  var url = BACKEND_URL + "?" + qs;
  
  fetch(url, { method: "GET", redirect: "follow" })
  .then(function(r) { return r.json(); })
  .then(function(json) { callback(json); })
  .catch(function(err) {
    // Fallback JSONP
    var cb = "cb_" + Date.now();
    window[cb] = function(json) { delete window[cb]; callback(json); };
    var s = document.createElement("script");
    s.src = url + "&callback=" + cb;
    document.head.appendChild(s);
    setTimeout(function() {
      if (window[cb]) {
        delete window[cb];
        callback({ok: false, error: "Timeout - reintentá"});
      }
    }, 15000);
  });
}
</script>
