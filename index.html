function cargarAusenciasDocentes() {
  var fecha = document.getElementById("ausDocFecha").value;
  callBackend("getAusenciasDocentes", {fecha: fecha}, function(res) {
    if (!res.ok || res.data.length === 0) {
      document.getElementById("ausDocentesList").innerHTML = '<div class="alert alert-info">Sin ausencias registradas para esta fecha.</div>';
      return;
    }
    var html = '<div class="table-container"><table class="data-table"><thead><tr><th>Docente</th><th>Horas afectadas</th><th>Motivo</th><th>Reemplazante</th></tr></thead><tbody>';
    res.data.forEach(function(a) {
      // Calcular impacto en el horario
      var impacto = calcularImpactoAusencia(a.docente_nombre, fecha);
      var impactoHtml = impacto.length > 0
        ? impacto.map(function(i){ return '<span style="background:#fff3cd;padding:1px 6px;border-radius:3px;font-size:11px;margin:1px;display:inline-block">'+i+'</span>'; }).join(' ')
        : '<span style="color:#ccc;font-size:12px">—</span>';
      html += '<tr><td><strong>'+a.docente_nombre+'</strong></td><td>'+impactoHtml+'</td><td>'+a.motivo+'</td><td>'+(a.reemplazante||'—')+'</td></tr>';
    });
    html += '</tbody></table></div>';
    document.getElementById("ausDocentesList").innerHTML = html;
  });
}

function calcularImpactoAusencia(nombreDocente, fecha) {
  // Convierte la fecha en día de la semana
  var diasMap = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
  var d = new Date(fecha + 'T12:00:00');
  var diaSemana = diasMap[d.getDay()];
  if (!diaSemana || diaSemana === 'domingo' || diaSemana === 'sabado') return [];

  var impacto = [];
  var nombreNorm = nombreDocente.toUpperCase().replace(/\.$/,'').trim();

  Object.keys(HORARIO_2026).forEach(function(key) {
    if (key.startsWith('_')) return;
    var curso = HORARIO_2026[key];
    var apellidoNorm = nombreNorm.split(' ')[0];

    // Verificar si es la maestra titular del grado
    if (curso.maestra_titular) {
      var titularNorm = curso.maestra_titular.toUpperCase().split(' ')[0];
      if (apellidoNorm === titularNorm || nombreNorm === curso.maestra_titular.toUpperCase()) {
        impacto.push(key + ' — todas las horas (MG titular)');
        return; // no seguir buscando en las horas del mismo grado
      }
    }

    // Verificar horas especiales
    curso.horas.forEach(function(h) {
      var doc = (h[diaSemana] || '').toUpperCase().replace(/\.$/,'').trim();
      if (doc && (doc.split(' ')[0] === apellidoNorm || doc === nombreNorm)) {
        impacto.push(key + ' ' + h.hora + ' (' + h.rango + ')');
      }
    });
  });
  return impacto;
}

function abrirModalAusenciaDocente() {
  // Armar lista de docentes desde _docentes (lista completa real)
  var listaDocentes = (HORARIO_2026._docentes || []).slice().sort(function(a,b){
    return a.nombre.localeCompare(b.nombre);
  });
  var docenteOpts = listaDocentes.map(function(d){
    return '<option value="'+d.nombre+'">'+d.nombre+' — '+d.rol+'</option>';
  }).join('');

  abrirModal("+ Registrar Ausencia Docente",
    '<div class="form-group"><label class="form-label">Fecha</label><input id="adFecha" type="date" class="form-control" value="'+fechaHoy()+'" onchange="previsualizarImpacto()"></div>' +
    '<div class="form-group"><label class="form-label">Docente *</label>' +
      '<select id="adNombre" class="form-control" onchange="previsualizarImpacto()">' +
        '<option value="">— Seleccioná —</option>' + docenteOpts +
      '</select></div>' +
    '<div id="adImpacto" style="margin-bottom:12px"></div>' +
    '<div class="form-group"><label class="form-label">Motivo</label>' +
      '<select id="adMotivo" class="form-control">' +
        '<option>Enfermedad</option><option>Licencia</option><option>Capacitación</option><option>Otro</option>' +
      '</select></div>' +
    '<div class="form-group"><label class="form-label">Reemplazante (opcional)</label><input id="adReemplazante" class="form-control"></div>',
    [{label:"💾 Registrar", cls:"btn-primary", fn:"registrarAusenciaDocenteSubmit()"}]
  );
}

function previsualizarImpacto() {
  var nombre = v("adNombre");
  var fecha  = v("adFecha");
  var el     = document.getElementById("adImpacto");
  if (!nombre || !fecha || !el) return;

  var impacto = calcularImpactoAusencia(nombre, fecha);
  if (impacto.length === 0) {
    el.innerHTML = '<div class="alert alert-info" style="font-size:12px">Este docente no tiene horas ese día.</div>';
  } else {
    el.innerHTML =
      '<div class="alert alert-warning" style="font-size:12px">' +
        '<strong>⚠️ Horas sin cubrir:</strong><br>' +
        impacto.map(function(i){ return '• '+i; }).join('<br>') +
      '</div>';
  }
}

function registrarAusenciaDocenteSubmit() {
  var nombre = v("adNombre");
  if (!nombre) { toast("Seleccioná un docente"); return; }
  callBackend("registrarAusenciaDocente", {
    fecha: v("adFecha"), docente_nombre: nombre,
    motivo: v("adMotivo"), reemplazante: v("adReemplazante")
  }, function(res) {
    if (res.ok) { cerrarModal(); toast("✅ Ausencia registrada"); cargarAusenciasDocentes(); }
    else toast("❌ " + res.error);
  });
}

function abrirModal(titulo, cuerpo, botones) {
  document.getElementById("modalTitle").textContent = titulo;
  document.getElementById("modalBody").innerHTML = cuerpo;
  var footer = document.getElementById("modalFooter");
  footer.innerHTML = '<button class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>';
  (botones||[]).forEach(function(b) {
    if (b.show === false) return;
    var btn = document.createElement("button");
    btn.className = "btn " + (b.cls||"btn-primary");
    btn.textContent = b.label;
    btn.setAttribute("onclick", b.fn);
    footer.appendChild(btn);
  });
  document.getElementById("modalOverlay").classList.add("open");
}

function cerrarModal() {
  document.getElementById("modalOverlay").classList.remove("open");
}

function v(id) {
  var el = document.getElementById(id);
  return el ? el.value : "";

function fechaHoy() {
  return new Date().toISOString().split("T")[0];
}

function toast(msg, dur) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, dur||3000);
}

function mostrarError(msg) {
  var t = document.getElementById("toast");
  t.style.background = "#C62828";
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); t.style.background="#323232"; }, 5000);
}

// ════════════════════════════════════════════════════════════
// BACKEND CALL
// ════════════════════════════════════════════════════════════
function callBackend(accion, data, callback) {
  var token = APP.usuario ? APP.usuario.email : "";
  
  // Construir URL con parámetros GET (evita CORS con Apps Script)
  var params = Object.assign({}, data, {accion: accion, token: token});
  var qs = Object.keys(params).map(function(k) {
    var val = params[k];
    if (typeof val === "object") val = JSON.stringify(val);
    return encodeURIComponent(k) + "=" + encodeURIComponent(val || "");
  }).join("&");
  
  var url = BACKEND_URL + "?" + qs;
  
  fetch(url, { method: "GET", redirect: "follow" })
  .then(function(r) { return r.json(); })
  .then(function(json) { callback(json); })
  .catch(function(err) {
    // Fallback JSONP
    var cb = "cb_" + Date.now();
    window[cb] = function(json) { delete window[cb]; callback(json); };
    var s = document.createElement("script");
    s.src = url + "&callback=" + cb;
    document.head.appendChild(s);
    setTimeout(function() {
      if (window[cb]) {
        delete window[cb];
        callback({ok: false, error: "Timeout - reintentá"});
      }
    }, 15000);
  });
}
